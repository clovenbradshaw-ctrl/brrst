  /* ios-style wiggle for nav reorder mode */

  /* mast head */
  /* hyphae sprout glyph — replaces the serif dot in the wordmark */
  .sprout {
    display: inline-block;
    width: 0.7em; height: 0.7em;
    background: currentColor;
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 22 V11' fill='none' stroke='black' stroke-width='2.4' stroke-linecap='round'/><path d='M12 12 C 8 11, 5 8, 5 5 C 8 5, 11 8, 12 12 Z' fill='black'/><path d='M12 14 C 16 13, 19 10, 19 7 C 16 7, 13 10, 12 14 Z' fill='black'/></svg>") center / contain no-repeat;
            mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 22 V11' fill='none' stroke='black' stroke-width='2.4' stroke-linecap='round'/><path d='M12 12 C 8 11, 5 8, 5 5 C 8 5, 11 8, 12 12 Z' fill='black'/><path d='M12 14 C 16 13, 19 10, 19 7 C 16 7, 13 10, 12 14 Z' fill='black'/></svg>") center / contain no-repeat;
    transform: translateY(0.05em);
  }

  /* mycelial divider — branching dotted line */
  .myc-rule {
    height: 14px;

  }

  /* growing wordmark dot - subtle pulse */
  .grow-dot { animation: grow 3.5s ease-in-out infinite; }
  @keyframes grow { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.12); opacity: 1; } }

  /* mycelial network background pattern - very subtle */
  .myc-bg {
    background-image:
      radial-gradient(circle at 12% 18%, rgba(163, 184, 138, 0.04) 0px, transparent 18%),

  .masthead-rule {

<!-- App code below -->
<script type="text/babel" data-presets="env,react">
'use strict';
const { useState, useEffect, useRef, useMemo, useCallback, useReducer, createContext, useContext } = React;

// ═══════════════════════════════════════════════════════════════════════════
//  CONFIG  ▌ user-supplied values
// ═══════════════════════════════════════════════════════════════════════════
const CONFIG = {
  // ─── proxy for fetching feeds (CORS workaround) ───
  // Expected interface: GET ${PROXY_URL}?url=<encoded-feed-url> → returns raw XML/RSS body
  // Easy n8n recipe: a webhook node that does HTTP Request → return as text
  PROXY_URL: 'https://n8n.intelechia.com/webhook/feed',  // <-- swap if different
  PROXY_PARAM: 'url',

  // ─── matrix homeserver ───
  // Left blank on purpose: each user supplies their own server at login,
  // either via the dedicated field or as the suffix of "user:server.com".
  MATRIX_HOMESERVER: '',
  MATRIX_ROOM_TOPIC: 'brrst-user-data',
  // custom matrix event types
  EVT_TRACKER:  'org.eo.brrst.tracker',   // small events posted directly to room
  EVT_SNAPSHOT: 'org.eo.brrst.snapshot',  // points to mxc:// blob in media store

  // ─── snapshot policy ───
  SNAPSHOT_EVERY_N_EVENTS: 50,
  SNAPSHOT_EVERY_MS: 5 * 60 * 1000,  // 5 min

  // ─── local store ───
  IDB_NAME: 'brrst',
  IDB_VERSION: 1,
};

// ═══════════════════════════════════════════════════════════════════════════
//  EO  ▌ emergent ontology event model
// ═══════════════════════════════════════════════════════════════════════════
//
//  An EO event has THREE components:
//    operator   — what kind of change   (NUL, SIG, DES, INS, SEG, CON, SYN, DEF, EVA, REC)
//    site       — where it occurs       (e.g. "feeds", "episodes/<id>", "playback")
//    resolution — how it resolves       ("committed", "pending", "rolled-back", ...)
//
//  In brrst:
//    INS feeds          → subscribe to a feed
//    DES feeds          → unsubscribe
//    SIG playback       → playback position update
//    SIG episodes/<id>  → mark played / unplayed
//    SEG queue          → reorder queue
//    CON playlists      → add episode to playlist
//    DEF tags           → define a tag
//    EVA episodes/<id>  → rate / star
//    REC episodes/<id>  → save for later
//    NUL                → genesis / reset
// ═══════════════════════════════════════════════════════════════════════════

const OP = Object.freeze({
  NUL: 'NUL', SIG: 'SIG', DES: 'DES', INS: 'INS',
  SEG: 'SEG', CON: 'CON', SYN: 'SYN',
  DEF: 'DEF', EVA: 'EVA', REC: 'REC',
});

// formal-logic glyph hints (display only)
const OP_GLYPH = {
  DEF: '⊢', EVA: '⊨', REC: '↬',
  INS: '+', DES: '−', SIG: '~',
  SEG: '|', CON: '∘', SYN: '∑', NUL: '∅',
};

// human label for ribbon
const OP_NAME = {
  INS: 'instantiate', DES: 'designate-end', SIG: 'signal',
  SEG: 'segment', CON: 'connect', SYN: 'synthesize',
  DEF: 'define', EVA: 'evaluate', REC: 'recommend', NUL: 'null',
};

let _seqCounter = 0;
const _now = () => Date.now();
const _uid = () => (crypto?.randomUUID?.() ?? (Math.random().toString(36).slice(2) + _now().toString(36)));

function makeEvent(op, site, payload, meta = {}) {
  _seqCounter += 1;
  const ts = _now();
  const id = _uid();
  return {
    id,
    seq: _seqCounter,
    ts,
    op,
    site,
    payload: payload ?? null,
    resolution: meta.resolution ?? 'committed',
    notation: renderNotation(op, site, payload),
    source: meta.source ?? 'local',
  };
}

function renderNotation(op, site, payload) {
  const tag = payload?.id ? `[${String(payload.id).slice(0,8)}]` : (payload?.url ? `[${shortUrl(payload.url)}]` : '');
  return `${op} ${site}${tag}`;
}

function shortUrl(u) {
  try { const h = new URL(u).hostname.replace(/^www\./, ''); return h; } catch { return ''; }
}


// ═══════════════════════════════════════════════════════════════════════════
//  IDB  ▌ Given-Log + projected state in IndexedDB
// ═══════════════════════════════════════════════════════════════════════════

const IDB = (() => {
  let _db = null;

  function open() {
    if (_db) return Promise.resolve(_db);
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(CONFIG.IDB_NAME, CONFIG.IDB_VERSION);
      req.onupgradeneeded = (ev) => {
        const db = ev.target.result;
        // append-only event log (the Given)
        if (!db.objectStoreNames.contains('log')) {
          const log = db.createObjectStore('log', { keyPath: 'seq', autoIncrement: true });
          log.createIndex('byTs', 'ts');
          log.createIndex('byOp', 'op');
        }
        // projected state — flat key/value rows
        if (!db.objectStoreNames.contains('state')) {
          db.createObjectStore('state', { keyPath: 'k' });
        }
        // feeds table
        if (!db.objectStoreNames.contains('feeds')) {
          const f = db.createObjectStore('feeds', { keyPath: 'id' });
          f.createIndex('byKind', 'kind');
        }
        // episodes / articles
        if (!db.objectStoreNames.contains('items')) {
          const it = db.createObjectStore('items', { keyPath: 'id' });
          it.createIndex('byFeed', 'feedId');
          it.createIndex('byPub', 'pubTs');
        }
        // outbox: events not yet shipped to matrix
        if (!db.objectStoreNames.contains('outbox')) {
          db.createObjectStore('outbox', { keyPath: 'seq' });
        }
        // misc kv (auth, settings)
        if (!db.objectStoreNames.contains('kv')) {
          db.createObjectStore('kv', { keyPath: 'k' });
        }
      };
      req.onsuccess = () => { _db = req.result; resolve(_db); };
      req.onerror = () => reject(req.error);
    });
  }

  async function tx(stores, mode, fn) {
    const db = await open();
    return new Promise((resolve, reject) => {
      const t = db.transaction(stores, mode);
      const result = fn(t);
      t.oncomplete = () => resolve(result);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error);
    });
  }

  function reqP(req) { return new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); }); }

  return {
    open,
    // Given-Log
    appendLog: (ev) => tx(['log', 'outbox'], 'readwrite', t => {
      t.objectStore('log').put(ev);
      t.objectStore('outbox').put(ev);
    }),
    // bulk append from sync
    bulkAppendLog: (events) => tx(['log'], 'readwrite', t => {
      const store = t.objectStore('log');
      for (const ev of events) store.put(ev);
    }),
    readLog: async (limit = 1000) => {
      const db = await open();
      return new Promise((res, rej) => {
        const t = db.transaction(['log'], 'readonly');
        const store = t.objectStore('log');
        const req = store.getAll();
        req.onsuccess = () => res(req.result.slice(-limit));
        req.onerror = () => rej(req.error);
      });
    },
    maxSeq: async () => {
      const db = await open();
      return new Promise((res, rej) => {
        const t = db.transaction(['log'], 'readonly');
        const store = t.objectStore('log');
        const req = store.openCursor(null, 'prev');
        req.onsuccess = () => res(req.result ? req.result.value.seq : 0);
        req.onerror = () => rej(req.error);
      });
    },
    // outbox (unshipped events)
    readOutbox: async () => {
      const db = await open();
      return new Promise((res, rej) => {
        const t = db.transaction(['outbox'], 'readonly');
        const req = t.objectStore('outbox').getAll();
        req.onsuccess = () => res(req.result);
        req.onerror = () => rej(req.error);
      });
    },
    clearOutbox: (seqs) => tx(['outbox'], 'readwrite', t => {
      const store = t.objectStore('outbox');
      for (const seq of seqs) store.delete(seq);
    }),
    // feeds
    putFeed: (feed) => tx(['feeds'], 'readwrite', t => t.objectStore('feeds').put(feed)),
    deleteFeed: (id) => tx(['feeds'], 'readwrite', t => t.objectStore('feeds').delete(id)),
    getFeeds: async () => {
      const db = await open();
      return new Promise((res, rej) => {
        const t = db.transaction(['feeds'], 'readonly');
        const req = t.objectStore('feeds').getAll();
        req.onsuccess = () => res(req.result);
        req.onerror = () => rej(req.error);
      });
    },
    // items
    putItem: (item) => tx(['items'], 'readwrite', t => t.objectStore('items').put(item)),
    putItems: (items) => tx(['items'], 'readwrite', t => {
      const store = t.objectStore('items');
      for (const it of items) store.put(it);
    }),
    getItemsByFeed: async (feedId) => {
      const db = await open();
      return new Promise((res, rej) => {
        const t = db.transaction(['items'], 'readonly');
        const idx = t.objectStore('items').index('byFeed');
        const req = idx.getAll(feedId);
        req.onsuccess = () => res(req.result);
        req.onerror = () => rej(req.error);
      });
    },
    getAllItems: async () => {
      const db = await open();
      return new Promise((res, rej) => {
        const t = db.transaction(['items'], 'readonly');
        const req = t.objectStore('items').getAll();
        req.onsuccess = () => res(req.result);
        req.onerror = () => rej(req.error);
      });
    },
    deleteItemsByFeed: async (feedId) => {
      const db = await open();
      return new Promise((res, rej) => {
        const t = db.transaction(['items'], 'readwrite');
        const idx = t.objectStore('items').index('byFeed');
        const req = idx.openCursor(feedId);
        req.onsuccess = (e) => {
          const cur = e.target.result;
          if (cur) { cur.delete(); cur.continue(); } else res();
        };
        req.onerror = () => rej(req.error);
      });
    },
    // state kv
    getState: async (k) => {
      const db = await open();
      return new Promise((res, rej) => {
        const t = db.transaction(['state'], 'readonly');
        const req = t.objectStore('state').get(k);
        req.onsuccess = () => res(req.result?.v ?? null);
        req.onerror = () => rej(req.error);
      });
    },
    setState: (k, v) => tx(['state'], 'readwrite', t => t.objectStore('state').put({ k, v })),
    // generic kv
    getKv: async (k) => {
      const db = await open();
      return new Promise((res, rej) => {
        const t = db.transaction(['kv'], 'readonly');
        const req = t.objectStore('kv').get(k);
        req.onsuccess = () => res(req.result?.v ?? null);
        req.onerror = () => rej(req.error);
      });
    },
    setKv: (k, v) => tx(['kv'], 'readwrite', t => t.objectStore('kv').put({ k, v })),
  };
})();


// ═══════════════════════════════════════════════════════════════════════════
//  RSS  ▌ feed parser with proper iTunes namespace handling
// ═══════════════════════════════════════════════════════════════════════════
//
//  Lessons from prior brrst iterations: standard querySelector() does NOT
//  pick up <itunes:image> et al. because those are namespaced. We must use
//  getElementsByTagNameNS or match by local-name.
//
//  Image priority for podcast episodes:
//    1. item-level <itunes:image href>
//    2. item-level <media:thumbnail>
//    3. item-level <media:content type="image/*">
//    4. item-level <enclosure type="image/*">
//    5. first <img> in <description>/<content:encoded>
//    6. channel-level <itunes:image>
//    7. channel-level <image><url>
// ═══════════════════════════════════════════════════════════════════════════

const NS = {
  itunes: 'http://www.itunes.com/dtds/podcast-1.0.dtd',
  media:  'http://search.yahoo.com/mrss/',
  content:'http://purl.org/rss/1.0/modules/content/',
  atom:   'http://www.w3.org/2005/Atom',
  podcast:'https://podcastindex.org/namespace/1.0',
  dc:     'http://purl.org/dc/elements/1.1/',
};

function getAllByLocalName(parent, localName) {
  // works regardless of namespace prefix
  const out = [];
  const walker = (node) => {
    if (!node) return;
    if (node.localName === localName) out.push(node);
    if (node.children) for (const c of node.children) walker(c);
  };
  walker(parent);
  return out;
}

function getFirstByLocalName(parent, localName) {
  const all = getAllByLocalName(parent, localName);
  return all[0] || null;
}

function textOf(parent, localName) {
  const el = getFirstByLocalName(parent, localName);
  return el ? (el.textContent || '').trim() : '';
}

function attrOf(el, attr) {
  return el?.getAttribute?.(attr) || '';
}

function extractImageFromHTML(html) {
  if (!html) return '';
  const m = String(html).match(/<img[^>]+src=["']([^"']+)["']/i);
  return m ? m[1] : '';
}

function extractItemImage(item, channelImg) {
  // 1. item itunes:image
  const allItunesImg = getAllByLocalName(item, 'image');
  for (const img of allItunesImg) {
    const href = attrOf(img, 'href');
    if (href) return href;
    const url = textOf(img, 'url');
    if (url) return url;
  }
  // 2. media:thumbnail
  const thumbs = getAllByLocalName(item, 'thumbnail');
  for (const t of thumbs) {
    const url = attrOf(t, 'url') || (t.textContent || '').trim();
    if (url) return url;
  }
  // 3. media:content with image type
  const mcs = getAllByLocalName(item, 'content');
  for (const mc of mcs) {
    const type = attrOf(mc, 'type');
    const url = attrOf(mc, 'url');
    if (url && /^image\//.test(type)) return url;
  }
  // 4. enclosure with image type
  const encs = getAllByLocalName(item, 'enclosure');
  for (const e of encs) {
    const type = attrOf(e, 'type');
    const url = attrOf(e, 'url');
    if (url && /^image\//.test(type)) return url;
  }
  // 5. img inside description/content:encoded
  const descHtml = textOf(item, 'encoded') || textOf(item, 'description') || textOf(item, 'summary');
  const fromHtml = extractImageFromHTML(descHtml);
  if (fromHtml) return fromHtml;
  // 6. channel fallback
  return channelImg || '';
}

function extractEnclosure(item) {
  const encs = getAllByLocalName(item, 'enclosure');
  for (const e of encs) {
    const type = attrOf(e, 'type');
    const url = attrOf(e, 'url');
    if (url && /^audio\//.test(type)) {
      return { url, type, length: attrOf(e, 'length') };
    }
  }
  // some feeds only have media:content audio
  const mcs = getAllByLocalName(item, 'content');
  for (const mc of mcs) {
    const type = attrOf(mc, 'type');
    const url = attrOf(mc, 'url');
    if (url && /^audio\//.test(type)) {
      return { url, type, length: attrOf(mc, 'fileSize') };
    }
  }
  return null;
}

function extractDuration(item) {
  // itunes:duration can be "HH:MM:SS", "MM:SS", or seconds
  const d = textOf(item, 'duration');
  if (!d) return 0;
  if (/^\d+$/.test(d)) return parseInt(d, 10);
  const parts = d.split(':').map(x => parseInt(x, 10) || 0);
  if (parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
  if (parts.length === 2) return parts[0]*60 + parts[1];
  return 0;
}

function stripHtml(s) {
  if (!s) return '';
  const div = document.createElement('div');
  div.innerHTML = s;
  return (div.textContent || div.innerText || '').trim();
}

// HTML-only named entities that XML doesn't know about.
// Note: amp/lt/gt/quot/apos are XML-standard and intentionally NOT in this map.
const XML_HTML_ENTITIES = {
  nbsp: '\u00a0',
  copy: '©', reg: '®', trade: '™',
  hellip: '…', mdash: '—', ndash: '–', minus: '−',
  lsquo: '\u2018', rsquo: '\u2019', ldquo: '\u201c', rdquo: '\u201d',
  sbquo: '\u201a', bdquo: '\u201e', prime: '′', Prime: '″',
  laquo: '«', raquo: '»', lsaquo: '‹', rsaquo: '›',
  middot: '·', bull: '•', sdot: '⋅',
  euro: '€', pound: '£', yen: '¥', cent: '¢',
  iexcl: '¡', iquest: '¿', sect: '§', para: '¶', deg: '°',
  plusmn: '±', times: '×', divide: '÷',
  sup2: '²', sup3: '³', frac12: '½', frac14: '¼', frac34: '¾',
  agrave: 'à', aacute: 'á', auml: 'ä', acirc: 'â', atilde: 'ã', aring: 'å', aelig: 'æ',
  egrave: 'è', eacute: 'é', euml: 'ë', ecirc: 'ê',
  igrave: 'ì', iacute: 'í', iuml: 'ï', icirc: 'î',
  ograve: 'ò', oacute: 'ó', ouml: 'ö', ocirc: 'ô', otilde: 'õ', oslash: 'ø', oelig: 'œ',
  ugrave: 'ù', uacute: 'ú', uuml: 'ü', ucirc: 'û',
  ntilde: 'ñ', ccedil: 'ç', szlig: 'ß',
  Agrave: 'À', Aacute: 'Á', Auml: 'Ä', Acirc: 'Â', Atilde: 'Ã', Aring: 'Å', AElig: 'Æ',
  Egrave: 'È', Eacute: 'É', Euml: 'Ë', Ecirc: 'Ê',
  Igrave: 'Ì', Iacute: 'Í', Iuml: 'Ï', Icirc: 'Î',
  Ograve: 'Ò', Oacute: 'Ó', Ouml: 'Ö', Ocirc: 'Ô', Otilde: 'Õ', Oslash: 'Ø', OElig: 'Œ',
  Ugrave: 'Ù', Uacute: 'Ú', Uuml: 'Ü', Ucirc: 'Û',
  Ntilde: 'Ñ', Ccedil: 'Ç',
};

// Sanitize XML bodies that contain unescaped ampersands or HTML named entities.
// Common in RSS feeds with HTML payloads — This American Life, NYT podcasts,
// many Substacks. Skips CDATA sections and comments since their contents are raw.
function sanitizeXml(xml) {
  if (!xml) return xml;
  const parts = xml.split(/(<!\[CDATA\[[\s\S]*?\]\]>|<!--[\s\S]*?-->)/);
  return parts.map((part, i) => {
    if (i % 2 === 1) return part;  // protected (CDATA or comment)
    return part
      // 1) translate HTML named entities to their unicode equivalents
      .replace(/&([a-zA-Z][a-zA-Z0-9]*);/g, (m, name) =>
        Object.prototype.hasOwnProperty.call(XML_HTML_ENTITIES, name)
          ? XML_HTML_ENTITIES[name]
          : m  // amp/lt/gt/quot/apos and unknown entities pass through
      )
      // 2) escape any bare & that isn't part of a valid entity ref
      .replace(/&(?!(?:[a-zA-Z][a-zA-Z0-9]*|#\d+|#x[0-9a-fA-F]+);)/g, '&amp;');
  }).join('');
}

function parseFeed(xmlText, feedUrl) {
  let txt = xmlText || '';
  let doc = new DOMParser().parseFromString(txt, 'application/xml');
  let errNode = doc.querySelector('parsererror');

  // retry once with sanitization — fixes the vast majority of malformed RSS
  // (bare ampersands inside HTML descriptions and URL query strings,
  // unknown HTML named entities like &nbsp; &mdash; etc.)
  if (errNode) {
    const sanitized = sanitizeXml(txt);
    if (sanitized !== txt) {
      txt = sanitized;
      doc = new DOMParser().parseFromString(txt, 'application/xml');
      errNode = doc.querySelector('parsererror');
    }
  }

  if (errNode) {
    const head = txt.slice(0, 140).replace(/\s+/g, ' ');
    const tail = txt.slice(-80).replace(/\s+/g, ' ');
    const len  = txt.length;
    const why  = (errNode.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 220);
    if (typeof window !== 'undefined') {
      window.brrst = window.brrst || {};
      window.brrst.lastBadBody = xmlText;
      window.brrst.lastBadFeed = feedUrl;
    }
    throw new Error(`xml parse failed (${len}b): ${why} ▸ head: "${head}…" ▸ tail: "…${tail}"`);
  }

  const isAtom = !!doc.querySelector('feed');
  if (isAtom) return parseAtom(doc, feedUrl);
  return parseRSS(doc, feedUrl);
}

function parseRSS(doc, feedUrl) {
  const channel = doc.querySelector('channel');
  if (!channel) throw new Error('No <channel> in feed');

  const title = textOf(channel, 'title');
  const description = stripHtml(textOf(channel, 'description') || textOf(channel, 'subtitle'));
  const link = textOf(channel, 'link');
  const author = textOf(channel, 'author') || textOf(channel, 'creator') || '';

  // channel image: itunes:image then <image><url>
  let channelImg = '';
  const itImg = getFirstByLocalName(channel, 'image');
  if (itImg) {
    channelImg = attrOf(itImg, 'href') || textOf(itImg, 'url');
  }

  // detect kind: presence of <itunes:*> or audio enclosures => podcast, else news
  const isPodcast = !!getFirstByLocalName(channel, 'duration')
    || !!getFirstByLocalName(channel, 'episode')
    || !!getFirstByLocalName(channel, 'category')
    || channel.querySelectorAll('item enclosure[type^="audio"]').length > 0
    || /podcast/i.test(channel.querySelector('generator')?.textContent || '');

  const itemEls = Array.from(channel.querySelectorAll(':scope > item'));
  const items = itemEls.map(item => {
    const enc = extractEnclosure(item);
    const itemTitle = textOf(item, 'title');
    const itemLink = textOf(item, 'link');
    const guid = textOf(item, 'guid') || itemLink || itemTitle + (textOf(item, 'pubDate') || '');
    const pub = textOf(item, 'pubDate') || textOf(item, 'date');
    const pubTs = pub ? Date.parse(pub) || 0 : 0;
    const descHtml = textOf(item, 'encoded') || textOf(item, 'description') || textOf(item, 'summary');
    const desc = stripHtml(descHtml);

    return {
      guid,
      title: itemTitle,
      link: itemLink,
      pub,
      pubTs,
      descHtml,
      desc,
      image: extractItemImage(item, channelImg),
      audio: enc?.url || null,
      audioType: enc?.type || null,
      audioLength: enc?.length || null,
      duration: extractDuration(item),
      author: textOf(item, 'creator') || textOf(item, 'author'),
    };
  });

  return {
    feed: {
      url: feedUrl,
      title,
      description,
      link,
      author,
      image: channelImg,
      kind: isPodcast ? 'podcast' : 'news',
    },
    items,
  };
}

function parseAtom(doc, feedUrl) {
  const feed = doc.querySelector('feed');
  const title = textOf(feed, 'title');
  const description = stripHtml(textOf(feed, 'subtitle') || '');
  const linkEl = Array.from(feed.children).find(c => c.localName === 'link' && (!c.getAttribute('rel') || c.getAttribute('rel') === 'alternate'));
  const link = linkEl ? attrOf(linkEl, 'href') : '';
  const author = textOf(feed, 'author');
  const channelImg = textOf(feed, 'logo') || textOf(feed, 'icon') || '';

  const entries = Array.from(feed.querySelectorAll(':scope > entry'));
  const items = entries.map(entry => {
    const itemTitle = textOf(entry, 'title');
    const links = Array.from(entry.children).filter(c => c.localName === 'link');
    const altLink = links.find(l => !l.getAttribute('rel') || l.getAttribute('rel') === 'alternate');
    const itemLink = altLink ? attrOf(altLink, 'href') : '';
    const guid = textOf(entry, 'id') || itemLink || itemTitle;
    const pub = textOf(entry, 'published') || textOf(entry, 'updated');
    const pubTs = pub ? Date.parse(pub) || 0 : 0;
    const descHtml = textOf(entry, 'content') || textOf(entry, 'summary');
    const desc = stripHtml(descHtml);
    return {
      guid, title: itemTitle, link: itemLink, pub, pubTs, descHtml, desc,
      image: extractItemImage(entry, channelImg),
      audio: null, audioType: null, audioLength: null, duration: 0,
      author: textOf(entry, 'author'),
    };
  });

  return {
    feed: { url: feedUrl, title, description, link, author, image: channelImg, kind: 'news' },
    items,
  };
}

async function getProxyConfig() {
  const url   = (await IDB.getKv('proxy.url'))   || CONFIG.PROXY_URL;
  const param = (await IDB.getKv('proxy.param')) || CONFIG.PROXY_PARAM;
  return { url, param };
}

async function fetchFeed(feedUrl) {
  const { url: proxyUrl, param: proxyParam } = await getProxyConfig();
  const url = `${proxyUrl}?${encodeURIComponent(proxyParam)}=${encodeURIComponent(feedUrl)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`proxy returned ${res.status}`);
  let body = await res.text();

  // stash raw for DevTools inspection
  if (typeof window !== 'undefined') {
    window.brrst = window.brrst || {};
    window.brrst.lastRawBody  = body;
    window.brrst.lastFeedUrl  = feedUrl;
  }

  // strip UTF-8 BOM if present (can break DOMParser if not at the very start)
  if (body.charCodeAt(0) === 0xFEFF) body = body.slice(1);

  // strip null bytes that can sneak in from misencoded streams
  if (body.indexOf('\x00') !== -1) body = body.replace(/\x00/g, '');

  // Defensive unwrap: some proxies (looking at you, n8n with default settings)
  // return JSON-wrapped responses like {"data":"<?xml..."}  or  "<?xml..."
  // (a JSON string with quotes). Unwrap before parsing.
  const trimmed = body.trimStart();
  if (trimmed.startsWith('{') || trimmed.startsWith('"')) {
    try {
      const parsed = JSON.parse(trimmed);
      if (typeof parsed === 'string') {
        body = parsed;
      } else if (parsed && typeof parsed === 'object') {
        body = parsed.data || parsed.body || parsed.xml || parsed.content || parsed.text || body;
      }
    } catch { /* not JSON, leave alone */ }
  }

  // strip any leading whitespace before the XML declaration
  body = body.replace(/^\s+/, '');

  return parseFeed(body, feedUrl);
}

// ─────────────────────────────────────────────────────────────────────────
//  URL NORMALIZATION  ▌ make pasted URLs Just Work
// ─────────────────────────────────────────────────────────────────────────

const REDDIT_HOSTS = new Set(['reddit.com', 'www.reddit.com', 'old.reddit.com', 'np.reddit.com']);

function normalizeFeedUrl(url) {
  try {
    const u = new URL(url);
    // Reddit: append .rss to the path (preserves query strings like ?q=foo)
    if (REDDIT_HOSTS.has(u.hostname) && !u.pathname.endsWith('.rss')) {
      u.pathname = u.pathname.replace(/\/$/, '') + '.rss';
      return u.toString();
    }
    // YouTube channels: convert /channel/UCxxx and /@handle URLs to feed URLs
    if (u.hostname === 'www.youtube.com' || u.hostname === 'youtube.com') {
      const m = u.pathname.match(/^\/channel\/(UC[\w-]+)/);
      if (m) return `https://www.youtube.com/feeds/videos.xml?channel_id=${m[1]}`;
      // /@handle and /c/name are not directly feedable without resolving — leave for auto-discovery
    }
    return url;
  } catch {
    return url;
  }
}

// ─────────────────────────────────────────────────────────────────────────
//  OPML  ▌ parse curated feed lists & emit subscriptions for backup
// ─────────────────────────────────────────────────────────────────────────

function parseOPML(xmlText) {
  const doc = new DOMParser().parseFromString(xmlText || '', 'application/xml');
  if (doc.querySelector('parsererror')) throw new Error('not valid OPML/XML');
  const outlines = doc.querySelectorAll('outline');
  const feeds = [];
  const seen = new Set();
  for (const ol of outlines) {
    const url = ol.getAttribute('xmlUrl') || ol.getAttribute('xmlurl');
    if (!url) continue;
    if (seen.has(url)) continue;
    seen.add(url);
    // walk parents to assemble category path
    const cats = [];
    let p = ol.parentElement;
    while (p && p.tagName?.toLowerCase() === 'outline' && !p.getAttribute('xmlUrl')) {
      const c = p.getAttribute('text') || p.getAttribute('title');
      if (c) cats.unshift(c);
      p = p.parentElement;
    }
    feeds.push({
      url,
      title:    ol.getAttribute('title') || ol.getAttribute('text') || '',
      htmlUrl:  ol.getAttribute('htmlUrl') || ol.getAttribute('htmlurl') || '',
      category: cats.join(' / '),
    });
  }
  return feeds;
}

function xmlEsc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function buildOPML(feeds) {
  const lines = [
    '<?xml version="1.0" encoding="UTF-8"?>',
    '<opml version="2.0">',
    '  <head>',
    '    <title>brrst subscriptions</title>',
    `    <dateCreated>${new Date().toUTCString()}</dateCreated>`,
    '  </head>',
    '  <body>',
  ];
  // group by kind
  const groups = { podcast: [], news: [] };
  for (const f of feeds) (groups[f.kind] || groups.news).push(f);
  for (const [kind, list] of Object.entries(groups)) {
    if (list.length === 0) continue;
    lines.push(`    <outline text="${kind === 'podcast' ? 'Podcasts' : 'News'}" title="${kind === 'podcast' ? 'Podcasts' : 'News'}">`);
    for (const f of list) {
      const t = xmlEsc(f.title || '');
      const u = xmlEsc(f.url || '');
      const h = xmlEsc(f.link || '');
      const d = xmlEsc((f.description || '').slice(0, 240));
      lines.push(`      <outline type="rss" text="${t}" title="${t}" xmlUrl="${u}" htmlUrl="${h}" description="${d}" />`);
    }
    lines.push('    </outline>');
  }
  lines.push('  </body>');
  lines.push('</opml>');
  return lines.join('\n');
}

async function importOPML(opmlText, onProgress) {
  const incoming = parseOPML(opmlText);
  const have = new Set(Object.values(store.state.feeds).map(f => normalizeFeedUrl(f.url)));
  const todo = incoming.filter(f => !have.has(normalizeFeedUrl(f.url)));
  let added = 0, failed = 0;
  for (let i = 0; i < todo.length; i++) {
    const f = todo[i];
    onProgress?.({ stage: 'fetching', done: i, total: todo.length, added, failed, current: f.title || f.url });
    try {
      await actionSubscribe(f.url);
      added++;
    } catch (e) {
      failed++;
      console.warn('opml import failed:', f.url, e?.message || e);
    }
  }
  const skipped = incoming.length - todo.length;
  onProgress?.({ stage: 'done', done: todo.length, total: todo.length, added, failed, skipped });
  return { added, skipped, failed, total: incoming.length };
}

function exportOPML() {
  const feeds = Object.values(store.state.feeds);
  const xml = buildOPML(feeds);
  const blob = new Blob([xml], { type: 'text/x-opml; charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `brrst-subscriptions-${new Date().toISOString().slice(0, 10)}.opml`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  return feeds.length;
}

function searchNewsDirectory(query) {
  const q = query.toLowerCase();
  const tokens = q.split(/\s+/).filter(Boolean);
  return NEWS_DIRECTORY
    .map(entry => {
      const hay = (entry.title + ' ' + entry.category + ' ' + entry.url).toLowerCase();
      let score = 0;
      for (const t of tokens) {
        if (entry.title.toLowerCase().includes(t)) score += 3;     // title weighted higher
        else if (hay.includes(t)) score += 1;
      }
      return { ...entry, _score: score };
    })
    .filter(e => e._score > 0)
    .sort((a, b) => b._score - a._score)
    .slice(0, 12);
}

function classifyInput(raw) {
  const s = (raw || '').trim();
  if (!s) return { kind: 'empty' };
  if (/^https?:\/\//i.test(s)) return { kind: 'url', value: s };
  if (/^([\w-]+\.)+[a-z]{2,}(\/.*)?$/i.test(s) && !/\s/.test(s)) {
    return { kind: 'domain', value: s };
  }
  return { kind: 'query', value: s };
}

// iTunes Search API — no auth, CORS-enabled, returns RSS feedUrl
async function searchItunesPodcasts(query, limit = 10) {
  const url = `https://itunes.apple.com/search?media=podcast&entity=podcast&limit=${limit}&term=${encodeURIComponent(query)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`itunes ${res.status}`);
  const data = await res.json();
  return (data.results || [])
    .filter(r => r.feedUrl)
    .map(r => ({
      title:    r.trackName || r.collectionName,
      author:   r.artistName,
      feedUrl:  r.feedUrl,
      image:    r.artworkUrl600 || r.artworkUrl100,
      genre:    r.primaryGenreName,
      itunesId: r.collectionId,
    }));
}

// Auto-discovery — fetch a site's HTML through the proxy, scan for <link rel="alternate">
async function discoverFeedsFromSite(siteUrl) {
  let url = (siteUrl || '').trim();
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  const { url: proxyUrl, param: proxyParam } = await getProxyConfig();
  const fetchUrl = `${proxyUrl}?${encodeURIComponent(proxyParam)}=${encodeURIComponent(url)}`;
  const res = await fetch(fetchUrl);
  if (!res.ok) throw new Error(`discovery: proxy returned ${res.status}`);
  const html = await res.text();
  const doc = new DOMParser().parseFromString(html, 'text/html');

  const out = [];
  const seen = new Set();
  const push = (href, title) => {
    if (!href) return;
    let abs;
    try { abs = new URL(href, url).href; } catch { return; }
    if (seen.has(abs)) return;
    seen.add(abs);
    out.push({ url: abs, title: title || abs });
  };

  doc.querySelectorAll('link[rel*="alternate" i]').forEach(link => {
    const type = (link.getAttribute('type') || '').toLowerCase();
    if (type.includes('rss') || type.includes('atom') || type.includes('xml')) {
      push(link.getAttribute('href'), link.getAttribute('title'));
    }
  });

  // also try common conventional paths (we don't HEAD-check them; just present as candidates)
  if (out.length === 0) {
    for (const path of ['/feed', '/rss', '/feed.xml', '/rss.xml', '/atom.xml', '/index.xml']) {
      push(new URL(path, url).href, path);
    }
  }

  return out;
}


// ═══════════════════════════════════════════════════════════════════════════
//  FOLD  ▌ projection function (the nine-case switch)
// ═══════════════════════════════════════════════════════════════════════════
//
//  processEvent(state, event) → newState
//
//  This is the *only* function that mutates projected state.
//  Replaying the entire log through fold from the empty state must reproduce
//  the current state exactly. (event sourcing, plain.)
// ═══════════════════════════════════════════════════════════════════════════

function emptyState() {
  return {
    feeds: {},          // id → feed
    items: {},          // id → item (denormalized; full RSS item rows live here)
    subscriptions: [],  // ordered list of feed ids
    plays: {},          // itemId → { positionSec, played: bool, lastTs }
    queue: [],          // ordered itemIds
    saved: {},          // itemId → { ts }
    ratings: {},        // itemId → { stars, ts }
    tags: {},           // tagId → { name, color, items: [itemIds] }
    nowPlaying: null,   // itemId or null
    settings: {},
    lastFetch: {},      // feedId → ts
  };
}

// Immutable update: each sub-collection that changes gets a new reference so
// React `useMemo([state.feeds])` and friends actually re-run. The top-level
// state object is shallow-copied by the caller (`dispatch`), so mutating `s`
// here is fine — but anything we read in components must get a fresh ref.
function fold(state, ev) {
  const s = state;
  const p = ev.payload || {};
  switch (ev.op) {
    case OP.NUL: {
      return emptyState();
    }
    case OP.INS: {
      // INS feeds  → subscribe
      if (ev.site === 'feeds' && p.feed) {
        s.feeds = { ...s.feeds, [p.feed.id]: p.feed };
        if (!s.subscriptions.includes(p.feed.id)) {
          s.subscriptions = [...s.subscriptions, p.feed.id];
        }
        if (Array.isArray(p.items) && p.items.length) {
          const nextItems = { ...s.items };
          for (const it of p.items) nextItems[it.id] = it;
          s.items = nextItems;
        }
        s.lastFetch = { ...s.lastFetch, [p.feed.id]: ev.ts };
      }
      // INS items → add fetched items (refresh)
      else if (ev.site === 'items' && Array.isArray(p.items)) {
        if (p.items.length) {
          const nextItems = { ...s.items };
          for (const it of p.items) nextItems[it.id] = it;
          s.items = nextItems;
        }
        if (p.feedId) s.lastFetch = { ...s.lastFetch, [p.feedId]: ev.ts };
      }
      return s;
    }
    case OP.DES: {
      // DES feeds → unsubscribe
      if (ev.site === 'feeds' && p.feedId) {
        const { [p.feedId]: _gone, ...restFeeds } = s.feeds;
        s.feeds = restFeeds;
        s.subscriptions = s.subscriptions.filter(id => id !== p.feedId);
        // drop items belonging to the removed feed
        const nextItems = {};
        for (const id of Object.keys(s.items)) {
          if (s.items[id].feedId !== p.feedId) nextItems[id] = s.items[id];
        }
        s.items = nextItems;
      }
      // DES episodes/<id> → mark played
      else if (ev.site.startsWith('episodes/') && p.itemId) {
        const cur = s.plays[p.itemId] || {};
        s.plays = { ...s.plays, [p.itemId]: { ...cur, played: true, lastTs: ev.ts } };
      }
      return s;
    }
    case OP.SIG: {
      // SIG playback → position update
      if (ev.site === 'playback' && p.itemId) {
        const cur = s.plays[p.itemId] || {};
        s.plays = { ...s.plays, [p.itemId]: { ...cur, positionSec: p.positionSec ?? cur.positionSec ?? 0, lastTs: ev.ts } };
        if (p.setNowPlaying) s.nowPlaying = p.itemId;
      }
      // SIG episodes/<id> → toggle played explicitly
      else if (ev.site.startsWith('episodes/') && p.itemId) {
        const cur = s.plays[p.itemId] || {};
        s.plays = { ...s.plays, [p.itemId]: { ...cur, played: !!p.played, lastTs: ev.ts } };
      }
      // SIG nowPlaying → just set/clear current item
      else if (ev.site === 'nowPlaying') {
        s.nowPlaying = p.itemId || null;
      }
      return s;
    }
    case OP.SEG: {
      // SEG queue → reorder / set queue
      if (ev.site === 'queue' && Array.isArray(p.queue)) {
        s.queue = [...p.queue];
      }
      return s;
    }
    case OP.CON: {
      // CON queue → push item to queue (or remove if remove flag)
      if (ev.site === 'queue' && p.itemId) {
        const filtered = s.queue.filter(id => id !== p.itemId);
        s.queue = p.remove ? filtered : [...filtered, p.itemId];
      }
      return s;
    }
    case OP.SYN: {
      // SYN snapshot → marker; no state mutation
      return s;
    }
    case OP.DEF: {
      if (ev.site === 'tags' && p.tag) {
        s.tags = { ...s.tags, [p.tag.id]: p.tag };
      }
      return s;
    }
    case OP.EVA: {
      if (ev.site.startsWith('episodes/') && p.itemId) {
        s.ratings = { ...s.ratings, [p.itemId]: { stars: p.stars || 0, ts: ev.ts } };
      }
      return s;
    }
    case OP.REC: {
      if (ev.site.startsWith('episodes/') && p.itemId) {
        if (p.remove) {
          const { [p.itemId]: _gone, ...restSaved } = s.saved;
          s.saved = restSaved;
        } else {
          s.saved = { ...s.saved, [p.itemId]: { ts: ev.ts } };
        }
      }
      return s;
    }
    default:
      return s;
  }
}

function replay(events) {
  let s = emptyState();
  for (const ev of events) s = fold(s, ev);
  return s;
}

// ═══════════════════════════════════════════════════════════════════════════
//  MATRIX  ▌ minimal client (login, room, send, media upload)
// ═══════════════════════════════════════════════════════════════════════════
//
//  We deliberately don't pull in matrix-js-sdk in this single-file build.
//  Just direct fetch calls against the C-S API r0/v3.
//
//  Auth: bearer token in Authorization header. Stored in IDB kv.
// ═══════════════════════════════════════════════════════════════════════════

class MatrixClient {
  constructor() {
    this.homeserver = (CONFIG.MATRIX_HOMESERVER || '').replace(/\/$/, '');
    this.token = null;
    this.userId = null;
    this.deviceId = null;
    this.roomId = null;
  }

  setHomeserver(url) {
    if (!url) return;
    this.homeserver = String(url).trim().replace(/\/$/, '');
  }

  // Accept either a full URL ("https://matrix.org") or a bare hostname
  // ("matrix.org"). For bare hostnames, try .well-known/matrix/client per
  // the spec to find the actual client API base URL — that's how matrix.org
  // and many vanity domains delegate to a different homeserver.
  async resolveHomeserver(input) {
    let raw = String(input || '').trim().replace(/\/$/, '');
    if (!raw) return null;
    if (!/^https?:\/\//i.test(raw)) raw = 'https://' + raw;
    try {
      const u = new URL(raw);
      const wk = await fetch(`${u.protocol}//${u.host}/.well-known/matrix/client`, { cache: 'no-store' });
      if (wk.ok) {
        const data = await wk.json().catch(() => null);
        const baseUrl = data && data['m.homeserver'] && data['m.homeserver'].base_url;
        if (baseUrl) return String(baseUrl).replace(/\/$/, '');
      }
    } catch { /* discovery is best-effort */ }
    return raw;
  }

  async restore() {
    const cred = await IDB.getKv('matrix.cred');
    if (!cred) return false;
    if (cred.homeserver) this.setHomeserver(cred.homeserver);
    this.token = cred.token;
    this.userId = cred.userId;
    this.deviceId = cred.deviceId;
    this.roomId = cred.roomId;
    // verify token still valid
    try {
      const r = await this._req('GET', '/_matrix/client/v3/account/whoami');
      if (r?.user_id) {
        this.userId = r.user_id;
        return true;
      }
    } catch (e) { /* fall through */ }
    return false;
  }

  async login(username, password, homeserver) {
    if (homeserver) {
      const resolved = await this.resolveHomeserver(homeserver);
      if (resolved) this.setHomeserver(resolved);
    }
    const body = {
      type: 'm.login.password',
      identifier: { type: 'm.id.user', user: username },
      password,
      initial_device_display_name: 'brrst',
    };
    const r = await fetch(`${this.homeserver}/_matrix/client/v3/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.error || `Login failed (${r.status})`);
    }
    const data = await r.json();
    this.token = data.access_token;
    this.userId = data.user_id;
    this.deviceId = data.device_id;
    await IDB.setKv('matrix.cred', {
      homeserver: this.homeserver,
      token: this.token,
      userId: this.userId,
      deviceId: this.deviceId,
      roomId: null,
    });
    return true;
  }

  async logout() {
    try { await this._req('POST', '/_matrix/client/v3/logout'); } catch {}
    this.token = null; this.userId = null; this.deviceId = null; this.roomId = null;
    await IDB.setKv('matrix.cred', null);
  }

  async _req(method, path, body) {
    const url = `${this.homeserver}${path}`;
    const headers = { 'Content-Type': 'application/json' };
    if (this.token) headers['Authorization'] = `Bearer ${this.token}`;
    const opts = { method, headers };
    if (body !== undefined) opts.body = JSON.stringify(body);
    const r = await fetch(url, opts);
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.error || `${method} ${path} → ${r.status}`);
    }
    return r.json();
  }

  // ensure a per-user private room exists, return its ID
  async ensureUserRoom() {
    if (this.roomId) return this.roomId;
    // try to find an existing room with our topic
    try {
      const synced = await this._req('GET', '/_matrix/client/v3/sync?timeout=0');
      const joinedRooms = synced?.rooms?.join || {};
      for (const [rid, rdata] of Object.entries(joinedRooms)) {
        const stateEvents = rdata.state?.events || rdata.timeline?.events || [];
        for (const ev of stateEvents) {
          if (ev.type === 'm.room.topic' && ev.content?.topic === CONFIG.MATRIX_ROOM_TOPIC) {
            this.roomId = rid;
            await this._persistRoom(rid);
            return rid;
          }
        }
      }
    } catch (e) { console.warn('sync probe failed', e); }
    // create a fresh private room
    const created = await this._req('POST', '/_matrix/client/v3/createRoom', {
      preset: 'private_chat',
      visibility: 'private',
      name: 'brrst — your data',
      topic: CONFIG.MATRIX_ROOM_TOPIC,
      creation_content: { 'org.eo.brrst': true },
    });
    this.roomId = created.room_id;
    await this._persistRoom(this.roomId);
    return this.roomId;
  }

  async _persistRoom(rid) {
    const cred = await IDB.getKv('matrix.cred');
    if (cred) await IDB.setKv('matrix.cred', { ...cred, roomId: rid });
  }

  // POST a tracker event into the user's room
  async sendTracker(payload) {
    if (!this.roomId) await this.ensureUserRoom();
    const txnId = _uid();
    const path = `/_matrix/client/v3/rooms/${encodeURIComponent(this.roomId)}/send/${encodeURIComponent(CONFIG.EVT_TRACKER)}/${txnId}`;
    return this._req('PUT', path, payload);
  }

  async sendSnapshotEvent(payload) {
    if (!this.roomId) await this.ensureUserRoom();
    const txnId = _uid();
    const path = `/_matrix/client/v3/rooms/${encodeURIComponent(this.roomId)}/send/${encodeURIComponent(CONFIG.EVT_SNAPSHOT)}/${txnId}`;
    return this._req('PUT', path, payload);
  }

  // upload a JSON blob to media store, return mxc URI
  async uploadJSONSnapshot(obj) {
    if (!this.token) throw new Error('Not logged in to Matrix');
    const blob = new Blob([JSON.stringify(obj)], { type: 'application/json' });
    const r = await fetch(`${this.homeserver}/_matrix/media/v3/upload?filename=brrst-snapshot.json`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.token}` },
      body: blob,
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.error || `Upload failed (${r.status})`);
    }
    const data = await r.json();
    return data.content_uri; // mxc://...
  }

  mxcToHttp(mxc) {
    if (!mxc?.startsWith('mxc://')) return mxc;
    const rest = mxc.slice(6);
    return `${this.homeserver}/_matrix/media/v3/download/${rest}`;
  }

  async fetchSnapshot(mxc) {
    if (!this.token) throw new Error('Not logged in to Matrix');
    const url = this.mxcToHttp(mxc);
    const r = await fetch(url, { headers: { 'Authorization': `Bearer ${this.token}` }});
    if (!r.ok) throw new Error(`Snapshot fetch failed (${r.status})`);
    return r.json();
  }

  // pull recent room events (initial hydration)
  async fetchRoomMessages(limit = 100) {
    if (!this.roomId) return { chunk: [] };
    const path = `/_matrix/client/v3/rooms/${encodeURIComponent(this.roomId)}/messages?dir=b&limit=${limit}`;
    return this._req('GET', path);
  }
}

const Matrix = new MatrixClient();


// ═══════════════════════════════════════════════════════════════════════════
//  STORE  ▌ central event-driven store, exposed via React context
// ═══════════════════════════════════════════════════════════════════════════

class Store {
  constructor() {
    this.state = emptyState();
    this.listeners = new Set();
    this.recentEvents = []; // ring buffer for the EO ribbon (last 50)
    this._lastSnapshotAt = 0;
    this._eventsSinceSnapshot = 0;
    this._snapshotTimer = null;
  }

  subscribe(fn) {
    this.listeners.add(fn);
    return () => this.listeners.delete(fn);
  }

  _emit() {
    for (const fn of this.listeners) fn(this.state);
  }

  async hydrate() {
    const log = await IDB.readLog(5000);
    if (log.length > 0) {
      _seqCounter = Math.max(...log.map(e => e.seq), 0);
      this.state = replay(log);
      this.recentEvents = log.slice(-50);
    }
    this._emit();
  }

  // Apply event: append to log, fold into state, push to outbox, emit, schedule sync
  async dispatch(op, site, payload, meta = {}) {
    const ev = makeEvent(op, site, payload, meta);
    this.state = fold({ ...this.state }, ev);
    this.recentEvents = [...this.recentEvents.slice(-49), ev];
    this._eventsSinceSnapshot += 1;
    this._emit();
    try { await IDB.appendLog(ev); } catch (e) { console.warn('log append failed', e); }
    // schedule background ship
    this._scheduleShip();
    return ev;
  }

  _scheduleShip() {
    if (this._eventsSinceSnapshot >= CONFIG.SNAPSHOT_EVERY_N_EVENTS) {
      this._eventsSinceSnapshot = 0;
      queueMicrotask(() => this.shipSnapshot().catch(e => console.warn('snapshot ship failed', e)));
    }
    if (!this._snapshotTimer) {
      this._snapshotTimer = setTimeout(() => {
        this._snapshotTimer = null;
        this.shipSnapshot().catch(e => console.warn('snapshot ship failed', e));
      }, CONFIG.SNAPSHOT_EVERY_MS);
    }
    // also ship lightweight trackers immediately for tiny events
    queueMicrotask(() => this.shipOutboxTrackers().catch(() => {}));
  }

  // Ship tiny tracker events directly to room (no media store)
  async shipOutboxTrackers() {
    if (!Matrix.token) return;
    const outbox = await IDB.readOutbox();
    if (outbox.length === 0) return;

    // Tracker events are small (no big payloads) — ship them in batches
    // We'll ship one tracker event that summarizes the batch
    const trackable = outbox.filter(ev => ev.op !== OP.INS || !ev.payload?.items);
    if (trackable.length === 0) return;

    // Group: send up to 20 events in one tracker
    const batch = trackable.slice(0, 20);
    try {
      await Matrix.sendTracker({
        msgtype: 'org.eo.brrst.tracker',
        body: `${batch.length} events`,
        events: batch.map(ev => ({
          id: ev.id,
          seq: ev.seq,
          ts: ev.ts,
          op: ev.op,
          site: ev.site,
          notation: ev.notation,
          // payload omitted intentionally; full body lives in the snapshot
        })),
        from_seq: batch[0].seq,
        to_seq: batch[batch.length - 1].seq,
      });
      await IDB.clearOutbox(batch.map(e => e.seq));
    } catch (e) {
      console.warn('tracker ship failed', e);
    }
  }

  // Ship a full snapshot of state diffs to media store, post pointer event
  async shipSnapshot() {
    if (!Matrix.token) return;
    const outbox = await IDB.readOutbox();
    if (outbox.length === 0) return;

    const fromSeq = outbox[0].seq;
    const toSeq = outbox[outbox.length - 1].seq;

    // The snapshot blob carries the full event payloads (which trackers omit)
    const snapshot = {
      version: 1,
      kind: 'brrst.diff',
      from_seq: fromSeq,
      to_seq: toSeq,
      generated_ts: _now(),
      events: outbox,
    };

    try {
      const mxc = await Matrix.uploadJSONSnapshot(snapshot);
      await Matrix.sendSnapshotEvent({
        msgtype: 'org.eo.brrst.snapshot',
        body: `SYN brrst :: snapshot[${fromSeq}..${toSeq}]`,
        notation: `${OP.SYN} brrst[${fromSeq}..${toSeq}]`,
        mxc,
        from_seq: fromSeq,
        to_seq: toSeq,
        event_count: outbox.length,
      });
      await IDB.clearOutbox(outbox.map(e => e.seq));
      this._lastSnapshotAt = _now();
      // also log a SYN locally
      const synEv = makeEvent(OP.SYN, 'brrst', { from: fromSeq, to: toSeq, mxc });
      this.recentEvents = [...this.recentEvents.slice(-49), synEv];
      this._emit();
    } catch (e) {
      console.warn('snapshot upload/send failed', e);
    }
  }

  // initial hydration from matrix (if local IDB is empty)
  async hydrateFromMatrix() {
    if (!Matrix.token) return;
    try {
      await Matrix.ensureUserRoom();
      const localMax = await IDB.maxSeq();
      if (localMax > 0) return; // we have local data; skip pull
      const msgs = await Matrix.fetchRoomMessages(200);
      const events = (msgs.chunk || []).reverse(); // chronological
      for (const ev of events) {
        if (ev.type === CONFIG.EVT_SNAPSHOT && ev.content?.mxc) {
          try {
            const blob = await Matrix.fetchSnapshot(ev.content.mxc);
            if (Array.isArray(blob.events)) {
              await IDB.bulkAppendLog(blob.events);
            }
          } catch (e) { console.warn('failed to hydrate snapshot', e); }
        }
      }
      await this.hydrate();
    } catch (e) { console.warn('matrix hydrate failed', e); }
  }
}

const store = new Store();

// React context
const StoreCtx = createContext(null);
function useStore() {
  const ctx = useContext(StoreCtx);
  if (!ctx) throw new Error('store missing');
  return ctx;
}

// hook: subscribe to store updates
function useStoreState() {
  const [, setTick] = useState(0);
  useEffect(() => store.subscribe(() => setTick(t => t + 1)), []);
  return store.state;
}

function useRecentEvents() {
  const [, setTick] = useState(0);
  useEffect(() => store.subscribe(() => setTick(t => t + 1)), []);
  return store.recentEvents;
}

const fmtTime = (sec) => {
  if (!sec || isNaN(sec)) return '0:00';
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  const m = Math.floor((sec / 60) % 60);
  const h = Math.floor(sec / 3600);
  return h > 0 ? `${h}:${m.toString().padStart(2,'0')}:${s}` : `${m}:${s}`;
};

const fmtDate = (ts) => {
  if (!ts) return '';
  const d = new Date(ts);
  const now = new Date();
  const diff = (now - d) / (1000 * 60 * 60);
  if (diff < 1) return 'just now';
  if (diff < 24) return `${Math.floor(diff)}h ago`;
  if (diff < 24 * 7) return `${Math.floor(diff / 24)}d ago`;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' });
};

const itemId = (feedId, guid) => `${feedId}::${btoa(unescape(encodeURIComponent(guid))).replace(/=+$/,'')}`;
const feedId = (url) => 'f_' + btoa(unescape(encodeURIComponent(url))).replace(/[+/=]/g, '').slice(0, 20);

// ═══════════════════════════════════════════════════════════════════════════
//  ACTIONS  ▌ all user-facing operations dispatch EO events
// ═══════════════════════════════════════════════════════════════════════════

async function actionSubscribe(rawUrl) {
  const url = normalizeFeedUrl(rawUrl);
  const parsed = await fetchFeed(url);
  const fid = feedId(url);
  const feed = {
    id: fid,
    ...parsed.feed,
    addedTs: _now(),
  };
  const items = parsed.items.map(it => ({
    id: itemId(fid, it.guid),
    feedId: fid,
    feedTitle: feed.title,
    feedImage: feed.image,
    ...it,
  }));
  await IDB.putFeed(feed);
  await IDB.putItems(items);
  await store.dispatch(OP.INS, 'feeds', { feed, items });
  return feed;
}

async function actionUnsubscribe(fid) {
  await IDB.deleteFeed(fid);
  await IDB.deleteItemsByFeed(fid);
  await store.dispatch(OP.DES, 'feeds', { feedId: fid });
}

// Reclassify a feed between the 'news' and 'podcast' tabs. Auto-detection
// keys off itunes:* tags and audio enclosures, which sometimes guesses wrong
// (audio-heavy news feeds, talk shows without enclosures, etc.) — this is
// the manual override.
async function actionSetFeedKind(fid, kind) {
  if (kind !== 'news' && kind !== 'podcast') return;
  const cur = store.state.feeds[fid];
  if (!cur || cur.kind === kind) return;
  const next = { ...cur, kind };
  await IDB.putFeed(next);
  await store.dispatch(OP.INS, 'feeds', { feed: next });
}

async function actionRefresh(fid) {
  const feed = store.state.feeds[fid];
  if (!feed) return;
  const parsed = await fetchFeed(feed.url);
  const items = parsed.items.map(it => ({
    id: itemId(fid, it.guid),
    feedId: fid,
    feedTitle: feed.title,
    feedImage: feed.image,
    ...it,
  }));
  await IDB.putItems(items);
  await store.dispatch(OP.INS, 'items', { feedId: fid, items });
}

async function actionRefreshAll() {
  const ids = store.state.subscriptions;
  for (const fid of ids) {
    try { await actionRefresh(fid); } catch (e) { console.warn('refresh failed for', fid, e); }
  }
}

async function actionSetPlaying(itemId) {
  await store.dispatch(OP.SIG, 'nowPlaying', { itemId });
}

async function actionUpdatePosition(itemId, positionSec) {
  await store.dispatch(OP.SIG, 'playback', { itemId, positionSec, setNowPlaying: true });
}

async function actionTogglePlayed(itemId) {
  const cur = store.state.plays[itemId];
  await store.dispatch(OP.SIG, `episodes/${itemId}`, { itemId, played: !cur?.played });
}

async function actionSave(itemId, remove = false) {
  await store.dispatch(OP.REC, `episodes/${itemId}`, { itemId, remove });
}

async function actionRate(itemId, stars) {
  await store.dispatch(OP.EVA, `episodes/${itemId}`, { itemId, stars });
}

async function actionEnqueue(itemId, remove = false) {
  await store.dispatch(OP.CON, 'queue', { itemId, remove });
}

// ═══════════════════════════════════════════════════════════════════════════
//  PLAYER  ▌ singleton audio element managed at the App root
// ═══════════════════════════════════════════════════════════════════════════

const PlayerCtx = createContext(null);
function usePlayer() { return useContext(PlayerCtx); }

function PlayerProvider({ children }) {
  const audioRef = useRef(null);
  const [playing, setPlaying] = useState(false);
  const [position, setPosition] = useState(0);
  const [duration, setDuration] = useState(0);
  const [rate, setRate] = useState(1);

  // ensure audio element exists
  useEffect(() => {
    if (!audioRef.current) {
      const audio = document.createElement('audio');
      audio.preload = 'metadata';
      document.body.appendChild(audio);
      audioRef.current = audio;
    }
    return () => { /* keep audio across remounts */ };
  }, []);

  useEffect(() => {
    const audio = audioRef.current;
    if (!audio) return;
    const onTime = () => setPosition(audio.currentTime || 0);
    const onDur  = () => setDuration(audio.duration || 0);
    const onPlay = () => setPlaying(true);
    const onPause = () => setPlaying(false);
    const onEnd = () => setPlaying(false);
    audio.addEventListener('timeupdate', onTime);
    audio.addEventListener('loadedmetadata', onDur);
    audio.addEventListener('durationchange', onDur);
    audio.addEventListener('play', onPlay);
    audio.addEventListener('pause', onPause);
    audio.addEventListener('ended', onEnd);
    return () => {
      audio.removeEventListener('timeupdate', onTime);
      audio.removeEventListener('loadedmetadata', onDur);
      audio.removeEventListener('durationchange', onDur);
      audio.removeEventListener('play', onPlay);
      audio.removeEventListener('pause', onPause);
      audio.removeEventListener('ended', onEnd);
    };
  }, []);

  // throttled position dispatch (every 5 sec while playing)
  useEffect(() => {
    if (!playing) return;
    const id = setInterval(() => {
      const audio = audioRef.current;
      const np = store.state.nowPlaying;
      if (audio && np && audio.currentTime > 0) {
        actionUpdatePosition(np, audio.currentTime).catch(() => {});
      }
    }, 5000);
    return () => clearInterval(id);
  }, [playing]);

  // Media Session API (lock-screen controls)
  useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.setActionHandler('play', () => audioRef.current?.play());
    navigator.mediaSession.setActionHandler('pause', () => audioRef.current?.pause());
    navigator.mediaSession.setActionHandler('seekbackward', () => seek(-15));
    navigator.mediaSession.setActionHandler('seekforward', () => seek(30));
  }, []);

  const playItem = useCallback(async (item) => {
    if (!item?.audio) return;
    const audio = audioRef.current;
    audio.src = item.audio;
    const saved = store.state.plays[item.id]?.positionSec || 0;
    if (saved > 0 && saved < (item.duration || 1e9) - 5) audio.currentTime = saved;
    audio.playbackRate = rate;
    await audio.play().catch(e => console.warn('play failed', e));
    await actionSetPlaying(item.id);
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: item.title,
        artist: item.feedTitle || item.author,
        album: 'brrst',
        artwork: item.image ? [{ src: item.image, sizes: '512x512' }] : [],
      });
    }
  }, [rate]);

  const toggle = useCallback(() => {
    const audio = audioRef.current;
    if (!audio?.src) return;
    if (audio.paused) audio.play(); else audio.pause();
  }, []);

  const seek = useCallback((delta) => {
    const audio = audioRef.current;
    if (!audio) return;
    audio.currentTime = Math.max(0, Math.min((audio.duration || 0), (audio.currentTime || 0) + delta));
  }, []);

  const seekTo = useCallback((t) => {
    const audio = audioRef.current;
    if (!audio) return;
    audio.currentTime = t;
  }, []);

  const setSpeed = useCallback((r) => {
    setRate(r);
    if (audioRef.current) audioRef.current.playbackRate = r;
  }, []);

  return (
    <PlayerCtx.Provider value={{ playing, position, duration, rate, playItem, toggle, seek, seekTo, setSpeed }}>
      {children}
    </PlayerCtx.Provider>
  );
}

//  UI COMPONENTS  ▌
// ═══════════════════════════════════════════════════════════════════════════

// ─────────────────────────────────────────────────────────────────────────
//  NAV TABS  ▌ iOS-style long-press to enter edit mode, then drag to reorder
// ─────────────────────────────────────────────────────────────────────────

const NAV_TABS = [
  { k: 'news',  label: 'News',     sub: 'feeds' },
  { k: 'pods',  label: 'Podcasts', sub: 'shows' },
  { k: 'saved', label: 'Saved',    sub: 'rec' },
  { k: 'queue', label: 'Queue',    sub: 'next' },
];

function NavTabs({ tab, setTab }) {
  const defaultOrder = NAV_TABS.map(t => t.k);
  const [order, setOrder]         = useState(defaultOrder);
  const [wiggling, setWiggling]   = useState(false);
  const [dragKey, setDragKey]     = useState(null);
  const [dragOffset, setDragOffset] = useState(0);

  const containerRef    = useRef(null);
  const slotRectsRef    = useRef([]);          // measured at drag start, by slot index
  const orderRef        = useRef(order);        // stable read inside pointer handlers
  orderRef.current      = order;
  const longPressTimer  = useRef(null);
  const longPressStart  = useRef({ x: 0, y: 0 });
  const dragStartXRef   = useRef(0);
  const movedRef        = useRef(false);

  // load saved order
  useEffect(() => {
    (async () => {
      const saved = await IDB.getKv('nav.order');
      if (Array.isArray(saved) && saved.length === defaultOrder.length) {
        const valid = saved.filter(k => defaultOrder.includes(k));
        if (valid.length === defaultOrder.length) setOrder(valid);
      }
    })();
  }, []);

  const persistOrder = (newOrder) => {
    setOrder(newOrder);
    IDB.setKv('nav.order', newOrder).catch(() => {});
  };

  // exit wiggle on outside tap or escape
  useEffect(() => {
    if (!wiggling) return;
    const onOutside = (e) => {
      if (!containerRef.current?.contains(e.target)) setWiggling(false);
    };
    const onEsc = (e) => { if (e.key === 'Escape') setWiggling(false); };
    document.addEventListener('pointerdown', onOutside);
    document.addEventListener('keydown', onEsc);
    return () => {
      document.removeEventListener('pointerdown', onOutside);
      document.removeEventListener('keydown', onEsc);
    };
  }, [wiggling]);

  const measureSlots = () => {
    if (!containerRef.current) return [];
    const rects = [];
    for (const child of containerRef.current.children) {
      if (child.dataset?.tabKey) rects.push(child.getBoundingClientRect());
    }
    return rects;
  };

  const startDrag = (e, key) => {
    slotRectsRef.current = measureSlots();
    setDragKey(key);
    dragStartXRef.current = e.clientX;
    setDragOffset(0);
    movedRef.current = false;
    try { e.target.setPointerCapture?.(e.pointerId); } catch {}
  };

  const onPointerDown = (e, key) => {
    // preventDefault so iOS doesn't show text-selection/callout
    if (e.pointerType !== 'mouse') e.preventDefault?.();
    if (wiggling) {
      startDrag(e, key);
      return;
    }
    longPressStart.current = { x: e.clientX, y: e.clientY };
    movedRef.current = false;
    longPressTimer.current = setTimeout(() => {
      longPressTimer.current = null;
      navigator.vibrate?.(30);
      setWiggling(true);
      // immediately grab this tab for drag
      slotRectsRef.current = measureSlots();
      setDragKey(key);
      dragStartXRef.current = longPressStart.current.x;
      setDragOffset(0);
    }, 420);
  };

  const onPointerMove = (e) => {
    // cancel long-press if pointer moves before timer fires
    if (longPressTimer.current && !wiggling) {
      const dx = Math.abs(e.clientX - longPressStart.current.x);
      const dy = Math.abs(e.clientY - longPressStart.current.y);
      if (dx > 6 || dy > 6) {
        clearTimeout(longPressTimer.current);
        longPressTimer.current = null;
      }
      return;
    }
    if (!dragKey) return;

    const ord = orderRef.current;
    const draggedSlotIdx = ord.indexOf(dragKey);
    if (draggedSlotIdx < 0) return;

    const draggedRect = slotRectsRef.current[draggedSlotIdx];
    if (!draggedRect) return;

    const offset = e.clientX - dragStartXRef.current;
    movedRef.current = movedRef.current || Math.abs(offset) > 2;
    setDragOffset(offset);

    const draggedCenter = draggedRect.left + draggedRect.width / 2 + offset;

    // find a slot whose center we've crossed
    for (let i = 0; i < slotRectsRef.current.length; i++) {
      if (i === draggedSlotIdx) continue;
      const slotRect = slotRectsRef.current[i];
      if (!slotRect) continue;
      const slotCenter = slotRect.left + slotRect.width / 2;
      const crossed =
        (i < draggedSlotIdx && draggedCenter < slotCenter) ||
        (i > draggedSlotIdx && draggedCenter > slotCenter);
      if (crossed) {
        // swap slots draggedSlotIdx ↔ i
        const newOrder = [...ord];
        [newOrder[draggedSlotIdx], newOrder[i]] = [newOrder[i], newOrder[draggedSlotIdx]];
        persistOrder(newOrder);
        // adjust visual offset so the dragged element stays under the finger
        // newOffset = (oldSlotLeft - newSlotLeft) + oldOffset
        const newOffset = (draggedRect.left - slotRectsRef.current[i].left) + offset;
        dragStartXRef.current = e.clientX - newOffset;
        setDragOffset(newOffset);
        navigator.vibrate?.(8);
        break;
      }
    }
  };

  const onPointerUp = (e, key) => {
    if (longPressTimer.current) {
      clearTimeout(longPressTimer.current);
      longPressTimer.current = null;
    }
    if (dragKey) {
      // animate snap back to natural position
      setDragKey(null);
      setDragOffset(0);
      // it was a drag, not a tap
      return;
    }
    if (!wiggling && !movedRef.current) {
      setTab(key);  // normal tap
    }
  };

  const onDoubleClick = () => {
    if (wiggling) setWiggling(false);
  };

  return (
    <nav
      ref={containerRef}
      className="px-4 sm:px-6 py-2 flex gap-6 text-sm relative"
      onDoubleClick={onDoubleClick}
    >
      {order.map((k, idx) => {
        const t = NAV_TABS.find(x => x.k === k);
        if (!t) return null;
        const isActive   = tab === t.k;
        const isDragging = dragKey === t.k;
        const wiggleCls  = wiggling && !isDragging ? (idx % 2 === 0 ? 'wiggle-a' : 'wiggle-b') : '';
        const dragStyle  = isDragging
          ? { transform: `translateX(${dragOffset}px) scale(1.06)`, transition: 'none', zIndex: 20 }
          : { transition: 'transform 0.2s ease-out' };
        return (
          <button
            key={t.k}
            data-tab-key={t.k}
            onPointerDown={e => onPointerDown(e, t.k)}
            onPointerMove={onPointerMove}
            onPointerUp={e => onPointerUp(e, t.k)}
            onPointerCancel={e => onPointerUp(e, t.k)}
            onContextMenu={e => e.preventDefault()}
            className={`relative py-1 text-left touch-none select-none ${isActive ? 'text-paper' : 'text-mute hover:text-paper/80'} ${wiggleCls} ${isDragging ? 'opacity-90 cursor-grabbing' : 'tap'} ${wiggling ? 'cursor-grab' : ''}`}
            style={dragStyle}
          >
            <span className="text-[15px] font-semibold tracking-tight">{t.label}</span>
            <span className="eo text-[9px] uppercase tracking-[0.15em] block leading-tight text-mute2">{t.sub}</span>
            {isActive && !wiggling && <div className="absolute -bottom-2 left-0 right-0 h-[2px] bg-moss rounded-full"></div>}
          </button>
        );
      })}
      {wiggling && (
        <button
          onClick={() => setWiggling(false)}
          className="ml-auto eo text-[10px] uppercase tracking-[0.2em] text-moss border border-moss/40 rounded-full px-3 hover:bg-moss/10 tap"
        >
          done
        </button>
      )}
    </nav>
  );
}

function SearchResults({ query, tab, onNavigate, onSubscribe, busySubscribe }) {
  const state = useStoreState();
  const cls = classifyInput(query);
  const [itunes, setItunes]         = useState([]);
  const [discovered, setDiscovered] = useState([]);
  const [loading, setLoading]       = useState(false);
  const [err, setErr]               = useState('');

  // Which discovery source applies for plain-text queries:
  //   pods tab → iTunes (podcast search)
  //   news tab → news directory only (no iTunes)
  //   other tabs (saved/queue) → both
  const wantsItunes = (tab === 'pods' || tab !== 'news');
  const wantsNewsDir = (tab === 'news' || tab !== 'pods');

  const newsDirHits = useMemo(() => {
    if (cls.kind !== 'query' || !wantsNewsDir) return [];
    return searchNewsDirectory(query);
  }, [query, cls.kind, wantsNewsDir]);

  const q = query.toLowerCase();

  const localFeeds = useMemo(() => {
    if (cls.kind === 'url') return [];
    return Object.values(state.feeds).filter(f =>
      (f.title || '').toLowerCase().includes(q) ||
      (f.author || '').toLowerCase().includes(q) ||
      (f.description || '').toLowerCase().includes(q) ||
      (f.url || '').toLowerCase().includes(q)
    ).slice(0, 8);
  }, [state.feeds, q, cls.kind]);

  const localItems = useMemo(() => {
    if (cls.kind === 'url') return [];
    return Object.values(state.items).filter(it =>
      (it.title || '').toLowerCase().includes(q) ||
      (it.desc || '').toLowerCase().includes(q) ||
      (it.feedTitle || '').toLowerCase().includes(q)
    ).sort((a, b) => (b.pubTs || 0) - (a.pubTs || 0)).slice(0, 12);
  }, [state.items, q, cls.kind]);

  // remote searches — debounced
  useEffect(() => {
    if (cls.kind !== 'query' && cls.kind !== 'domain') {
      setItunes([]); setDiscovered([]); setErr(''); return;
    }
    // Skip iTunes fetch when news context — news directory handles plain queries
    if (cls.kind === 'query' && !wantsItunes) {
      setItunes([]); setDiscovered([]); setErr(''); return;
    }
    let cancelled = false;
    const t = setTimeout(async () => {
      setLoading(true); setErr('');
      try {
        if (cls.kind === 'query') {
          const r = await searchItunesPodcasts(query, 8);
          if (!cancelled) { setItunes(r); setDiscovered([]); }
        } else if (cls.kind === 'domain') {
          const r = await discoverFeedsFromSite(cls.value);
          if (!cancelled) { setDiscovered(r); setItunes([]); }
        }
      } catch (e) {
        if (!cancelled) setErr(e.message || String(e));
      } finally {
        if (!cancelled) setLoading(false);
      }
    }, 380);
    return () => { cancelled = true; clearTimeout(t); };
  }, [query, cls.kind, cls.value, wantsItunes]);

  const subscribedUrls = useMemo(
    () => new Set(Object.values(state.feeds).map(f => f.url)),
    [state.feeds]
  );

  const nothing =
    localFeeds.length === 0 &&
    localItems.length === 0 &&
    itunes.length === 0 &&
    discovered.length === 0 &&
    newsDirHits.length === 0 &&
    !loading && !err && cls.kind !== 'url';

  return (
    <div className="absolute top-full left-0 right-0 mt-2 ink2 border border-paper/12 rounded-2xl shadow-2xl shadow-black/40 max-h-[70vh] overflow-y-auto clean-scroll z-30 fade-in">
      {cls.kind === 'url' && (
        <div className="px-4 py-4">
          <div className="eo text-[10px] uppercase tracking-[0.2em] text-moss mb-1">↬ feed url detected</div>
          <div className="text-[13px] text-paper/80 break-all">{cls.value}</div>
          <div className="eo text-[10px] text-mute mt-2">press enter or tap INS to subscribe</div>
        </div>
      )}

      {localFeeds.length > 0 && (
        <ResultSection label="your feeds" count={localFeeds.length}>
          {localFeeds.map(f => (
            <ResultRow
              key={f.id}
              image={f.image}
              icon={f.kind === 'podcast' ? 'mic' : 'rss'}
              title={f.title}
              subtitle={f.author || shortUrl(f.url)}
              meta={f.kind === 'podcast' ? 'podcast' : 'feed'}
              onClick={() => onNavigate({ type: 'feed', id: f.id })}
            />
          ))}
        </ResultSection>
      )}

      {localItems.length > 0 && (
        <ResultSection label="episodes & articles" count={localItems.length}>
          {localItems.map(it => {
            const feed = state.feeds[it.feedId];
            const isPod = feed?.kind === 'podcast';
            return (
              <ResultRow
                key={it.id}
                image={it.image || it.feedImage}
                icon={isPod ? 'play' : 'rss'}
                title={it.title}
                subtitle={it.feedTitle}
                meta={fmtDate(it.pubTs)}
                onClick={() => onNavigate({ type: 'item', id: it.id })}
              />
            );
          })}
        </ResultSection>
      )}

      {cls.kind === 'query' && wantsNewsDir && newsDirHits.length > 0 && (
        <ResultSection label="news outlets · directory" count={newsDirHits.length}>
          {newsDirHits.map(d => {
            const subscribed = subscribedUrls.has(d.url);
            return (
              <ResultRow
                key={d.url}
                icon="rss"
                title={d.title}
                subtitle={d.category}
                meta={subscribed ? '✓ subscribed' : 'feed'}
                metaClass={subscribed ? 'text-moss' : 'text-mute'}
                onClick={() => !subscribed && onSubscribe(d.url)}
                disabled={subscribed || busySubscribe}
                action={subscribed ? null : 'INS'}
              />
            );
          })}
        </ResultSection>
      )}

      {cls.kind === 'query' && wantsItunes && (itunes.length > 0 || loading) && (
        <ResultSection label="discover podcasts · itunes" count={itunes.length}>
          {loading && itunes.length === 0 && (
            <div className="px-4 py-3 eo text-[10px] uppercase tracking-[0.18em] text-mute blink-cursor">searching itunes</div>
          )}
          {itunes.map(r => {
            const subscribed = subscribedUrls.has(r.feedUrl);
            return (
              <ResultRow
                key={r.feedUrl}
                image={r.image}
                icon="mic"
                title={r.title}
                subtitle={r.author}
                meta={subscribed ? '✓ subscribed' : (r.genre || 'podcast')}
                metaClass={subscribed ? 'text-moss' : 'text-mute'}
                onClick={() => !subscribed && onSubscribe(r.feedUrl)}
                disabled={subscribed || busySubscribe}
                action={subscribed ? null : 'INS'}
              />
            );
          })}
        </ResultSection>
      )}

      {cls.kind === 'domain' && (discovered.length > 0 || loading) && (
        <ResultSection label={`feeds at ${cls.value}`} count={discovered.length}>
          {loading && discovered.length === 0 && (
            <div className="px-4 py-3 eo text-[10px] uppercase tracking-[0.18em] text-mute blink-cursor">scanning page</div>
          )}
          {discovered.map(d => {
            const subscribed = subscribedUrls.has(d.url);
            return (
              <ResultRow
                key={d.url}
                icon="rss"
                title={d.title}
                subtitle={d.url}
                meta={subscribed ? '✓ subscribed' : 'discovered'}
                metaClass={subscribed ? 'text-moss' : 'text-mute'}
                onClick={() => !subscribed && onSubscribe(d.url)}
                disabled={subscribed || busySubscribe}
                action={subscribed ? null : 'INS'}
              />
            );
          })}
        </ResultSection>
      )}

      {err && (
        <div className="px-4 py-3 eo text-[10.5px] text-rust">{err}</div>
      )}

      {nothing && cls.kind !== 'empty' && (
        <div className="px-4 py-6 text-center">
          <div className="eo text-[10px] uppercase tracking-[0.2em] text-mute mb-1">↬ no matches</div>
          <div className="text-[13px] text-paper/60">try a different term, paste a URL, or enter a domain</div>
        </div>
      )}
    </div>
  );
}

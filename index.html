function SubscribeBar({ tab, onSubscribe, onNavigate, inputRef: externalInputRef }) {
  const [text, setText]       = useState('');
  const [focused, setFocused] = useState(false);
  const [busy, setBusy]       = useState(false);
  const [err, setErr]         = useState('');

  const containerRef = useRef(null);
  const localInputRef = useRef(null);
  const inputRef = externalInputRef || localInputRef;

  // close panel on outside click or escape
  useEffect(() => {
    if (!focused) return;
    const onOut = (e) => {
      if (!containerRef.current?.contains(e.target)) setFocused(false);
    };
    const onEsc = (e) => { if (e.key === 'Escape') { setFocused(false); inputRef.current?.blur(); } };
    document.addEventListener('pointerdown', onOut);
    document.addEventListener('keydown', onEsc);
    return () => {
      document.removeEventListener('pointerdown', onOut);
      document.removeEventListener('keydown', onEsc);
    };
  }, [focused]);

  const trySubscribe = async (url) => {
    setBusy(true); setErr('');
    try {
      await onSubscribe(url);
      setText('');
      setFocused(false);
    } catch (e) {
      setErr((e.message || String(e)).slice(0, 200));
    } finally {
      setBusy(false);
    }
  };

  const submit = async (e) => {
    e?.preventDefault();
    const cls = classifyInput(text);
    if (cls.kind === 'url') {
      await trySubscribe(cls.value);
    } else if (cls.kind === 'domain') {
      try {
        const found = await discoverFeedsFromSite(cls.value);
        if (found.length === 1) await trySubscribe(found[0].url);
      } catch (e2) {
        setErr(e2.message || String(e2));
      }
    }
  };

  const handleNavigate = (action) => {
    onNavigate?.(action);
    setText('');
    setFocused(false);
    inputRef.current?.blur();
  };

  const cls = classifyInput(text);
  const showPanel = focused && text.trim().length >= 2;
  const ctaLabel  = cls.kind === 'url' ? 'INS' : (cls.kind === 'domain' ? '↬' : '↵');

  return (
    <div ref={containerRef} className="relative mx-5 sm:mx-8 mt-6 mb-2 z-30">
      <form
        onSubmit={submit}
        className="px-5 py-3 ink2 border border-paper/10 hover:border-moss/30 focus-within:border-moss/40 transition-colors flex gap-3 items-center rounded-full"
      >
        <Icon name="search" size={15} className="text-moss flex-shrink-0" />
        <input
          ref={inputRef}
          type="text"
          value={text}
          onChange={e => { setText(e.target.value); setErr(''); }}
          onFocus={() => setFocused(true)}
          placeholder="search podcasts · or paste an RSS URL"
          className="flex-1 bg-transparent border-none outline-none text-sm placeholder:text-mute2 text-paper font-mono min-w-0"
          autoComplete="off"
          autoCorrect="off"
          spellCheck="false"
          enterKeyHint={cls.kind === 'url' ? 'go' : 'search'}
        />
        {(cls.kind === 'url' || cls.kind === 'domain') && (
          <button
            type="submit"
            disabled={busy}
            className="eo-op text-[10px] text-moss hover:text-ink hover:bg-moss tap px-2.5 py-1 border border-moss/40 hover:border-moss transition-colors rounded-full disabled:opacity-50 flex-shrink-0"
          >
            {busy ? '…' : ctaLabel}
          </button>
        )}
        {err && <div className="eo text-[10px] text-rust ml-1 max-w-[40%] truncate hidden sm:block">{err}</div>}
      </form>
      {err && <div className="eo text-[10px] text-rust mt-1 px-3 sm:hidden break-words">{err}</div>}
      {showPanel && (
        <SearchResults
          query={text.trim()}
          tab={tab}
          onNavigate={handleNavigate}
          onSubscribe={async (url) => { await trySubscribe(url); }}
          busySubscribe={busy}
        />
      )}
    </div>
  );
}

//  SORTING  ▌ persistent per-view sort preference + dropdown picker

const SORT_FNS = {
  newest:   (a, b) => (b.pubTs || 0) - (a.pubTs || 0),
  oldest:   (a, b) => (a.pubTs || 0) - (b.pubTs || 0),
  source:   (a, b) => (a.feedTitle || '').localeCompare(b.feedTitle || '') || ((b.pubTs || 0) - (a.pubTs || 0)),
  alpha:    (a, b) => (a.title || '').localeCompare(b.title || ''),
  duration: (a, b) => (b.duration || 0) - (a.duration || 0),
};

function applySort(items, sort, plays) {
  const arr = items.slice();
  if (sort === 'unplayed') {
    return arr.sort((a, b) => {
      const ap = plays?.[a.id]?.played ? 1 : 0;
      const bp = plays?.[b.id]?.played ? 1 : 0;
      if (ap !== bp) return ap - bp;
      return SORT_FNS.newest(a, b);
    });
  }
  return arr.sort(SORT_FNS[sort] || SORT_FNS.newest);
}

function useSort(viewKey, defaultValue = 'newest') {
  const [sort, setSort] = useState(defaultValue);
  useEffect(() => {
    IDB.getKv(`sort.${viewKey}`).then(v => { if (v) setSort(v); }).catch(() => {});
  }, [viewKey]);
  const update = useCallback((v) => {
    setSort(v);
    IDB.setKv(`sort.${viewKey}`, v).catch(() => {});
  }, [viewKey]);
  return [sort, update];
}

function SortPicker({ value, onChange, options, theme = 'dark' }) {

    document.addEventListener('pointerdown', close);
    return () => document.removeEventListener('pointerdown', close);
  }, [open]);

  const current = options.find(o => o.k === value) || options[0];

  const triggerCls = theme === 'light'
    ? 'text-ink/55 hover:text-ink border-ink/15 hover:border-moss2/60'
    : 'text-mute hover:text-paper border-paper/15 hover:border-moss/40';

  return (
    <div ref={ref} className="relative">
      <button
        onClick={() => setOpen(o => !o)}
        className={`eo text-[10px] uppercase tracking-[0.18em] tap px-2.5 py-1 border rounded-full flex items-center gap-1 ${triggerCls}`}
      >

        <div className="absolute right-0 top-full mt-1 ink2 border border-paper/15 rounded-xl shadow-xl shadow-black/40 z-40 min-w-[180px] py-1 fade-in">
          {options.map(o => (

              key={o.k}
              onClick={() => { onChange(o.k); setOpen(false); }}

            >
              {o.k === value ? '· ' : '  '}{o.label}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

// Thumbnail card for a subscribed feed. Tapping the image opens the profile;
// the corner ⋯ button opens an action menu (move/delete) so the user can
// reclassify a misdetected feed or unsubscribe without drilling in. The
// menu renders via a portal because the strip uses overflow-x:auto, which
// would otherwise clip the popover vertically.
function SourceCard({ feed, onOpen, theme = 'dark' }) {
  const [menu, setMenu] = useState(false);
  const [menuPos, setMenuPos] = useState(null);
  const triggerRef = useRef(null);
  const menuRef = useRef(null);

  useEffect(() => {
    if (!menu) return;
    const handler = (e) => {
      const inTrigger = triggerRef.current && triggerRef.current.contains(e.target);
      const inMenu = menuRef.current && menuRef.current.contains(e.target);
      if (!inTrigger && !inMenu) setMenu(false);
    };
    const esc = (e) => { if (e.key === 'Escape') setMenu(false); };
    const onScroll = () => setMenu(false);
    document.addEventListener('mousedown', handler);
    document.addEventListener('touchstart', handler, { passive: true });
    document.addEventListener('keydown', esc);
    window.addEventListener('scroll', onScroll, true);
    return () => {
      document.removeEventListener('mousedown', handler);
      document.removeEventListener('touchstart', handler);
      document.removeEventListener('keydown', esc);
      window.removeEventListener('scroll', onScroll, true);
    };
  }, [menu]);

  const isPodcast = feed.kind === 'podcast';

  const isLight = theme === 'light';
  const tileBg = isLight
    ? 'bg-ink/5 border border-ink/10'
    : 'bg-ink3 cover-shadow';
  const titleClass = isLight ? 'text-ink' : 'text-paper';
  const metaClass  = isLight ? 'text-ink/45' : 'text-mute2';
  const fallback   = isLight ? 'text-ink/30' : 'text-mute2';
  const menuPanel  = isLight
    ? 'bg-paper border border-ink/15 text-ink'
    : 'ink2 border border-paper/15 text-paper';
  const menuDel    = isLight ? 'text-rust hover:bg-rust/10' : 'text-rust hover:bg-rust/15';

  const openMenu = (e) => {
    e.stopPropagation();
    if (menu) { setMenu(false); return; }
    const r = triggerRef.current.getBoundingClientRect();
    const W = 176; // matches w-44
    const left = Math.min(window.innerWidth - W - 8, r.right - W);
    const top = r.bottom + 4;
    setMenuPos({ top, left: Math.max(8, left) });
    setMenu(true);
  };

  const handleDelete = () => {
    setMenu(false);
    if (confirm(`Unsubscribe from "${feed.title}"?`)) actionUnsubscribe(feed.id);
  };

  return (
    <div className="flex-shrink-0 w-36 sm:w-44 relative">
      <button onClick={() => onOpen(feed.id)} className="block text-left tap w-full">
        <div className={`aspect-square mb-3 overflow-hidden rounded-2xl ${tileBg}`}>
          {feed.image ? (
            <img src={feed.image} alt={feed.title} className="w-full h-full object-cover" loading="lazy" />
          ) : (
            <div className={`w-full h-full flex items-center justify-center ${fallback}`}>
              <Icon name={isPodcast ? 'mic' : 'external'} size={24} />
            </div>
          )}
        </div>
        <div className={`text-[14px] font-medium leading-snug clamp-2 ${titleClass}`}>{feed.title}</div>
        <div className={`eo text-[9px] ${metaClass} uppercase tracking-[0.12em] mt-1.5 clamp-1`}>{feed.author || shortUrl(feed.url)}</div>
      </button>
      <button
        ref={triggerRef}
        onClick={openMenu}
        aria-label={`Actions for ${feed.title}`}
        className="absolute top-1.5 right-1.5 w-7 h-7 rounded-full bg-black/55 text-white flex items-center justify-center backdrop-blur-sm hover:bg-black/75 tap">
        <Icon name="more" size={14} />
      </button>
      {menu && menuPos && ReactDOM.createPortal(
        <div
          ref={menuRef}
          style={{ position: 'fixed', top: menuPos.top, left: menuPos.left, width: 176, zIndex: 1000 }}
          className={`rounded-xl py-1 shadow-xl fade-in ${menuPanel}`}>

        </div>,
        document.body
      )}

  );
}

  const state = useStoreState();
  const openItem = openItemId ? state.items[openItemId] : null;
  const openFeed = openFeedId && state.feeds[openFeedId]?.kind !== 'podcast' ? state.feeds[openFeedId] : null;
  const [sort, setSort] = useSort('news', 'newest');

  const newsFeeds = useMemo(() => {
    return Object.values(state.feeds)
      .filter(f => f.kind !== 'podcast')
      .sort((a, b) => (b.addedTs || 0) - (a.addedTs || 0));
  }, [state.feeds]);

  const items = useMemo(() => {

  if (openFeed) return <FeedDetail feed={openFeed} onClose={() => setOpenFeedId(null)} onOpenItem={setOpenItemId} />;

function EpisodeRow({ item, hideShow = false, onOpen }) {
  const player = usePlayer();
  const state = useStoreState();
  const isCurrent = state.nowPlaying === item.id;
  const play = state.plays[item.id];
  const positionPct = play?.positionSec && item.duration ? Math.min(100, (play.positionSec / item.duration) * 100) : 0;

  const open = () => onOpen?.(item.id);

  return (
    <li className="py-5 sm:py-6">
      <div className="flex gap-4 sm:gap-5">
        {item.image && !hideShow && (
          <button onClick={open} className="w-16 h-16 sm:w-20 sm:h-20 flex-shrink-0 bg-ink3 rounded-xl overflow-hidden tap">
            <img src={item.image} alt="" className="w-full h-full object-cover" loading="lazy" />
          </button>
        )}
        <div className="flex-1 min-w-0">
          {!hideShow && <div className="eo text-[10px] uppercase tracking-[0.15em] text-moss/80 mb-1 clamp-1">{item.feedTitle}</div>}
          <button onClick={open} className="text-left w-full">
            <div className={`text-[15.5px] sm:text-[16px] font-medium leading-snug ${play?.played ? 'text-mute' : 'text-paper'} clamp-2`}>{item.title}</div>
          </button>
          <div className="flex items-center gap-3 mt-3 text-[11px] text-mute eo tabular-nums">
            <span>{fmtDate(item.pubTs)}</span>
            {item.duration > 0 && <span>· {fmtTime(item.duration)}</span>}
            {play?.played && <span className="text-sage">· played</span>}
            {play?.positionSec > 0 && !play?.played && <span className="text-moss">· {fmtTime(play.positionSec)} in</span>}
          </div>
        </div>
        <div className="flex flex-col items-end gap-2">
          <button
            onClick={() => isCurrent ? player.toggle() : player.playItem(item)}
            className={`w-12 h-12 rounded-full border-2 ${isCurrent && player.playing ? 'border-moss bg-moss text-ink pulse-moss' : 'border-paper/25 text-paper hover:border-moss hover:text-moss'} flex items-center justify-center tap transition-colors`}
            disabled={!item.audio}
          >
            <Icon name={isCurrent && player.playing ? 'pause' : 'play'} size={16} />
          </button>
          <div className="flex gap-2">
            <button onClick={() => actionSave(item.id, !!state.saved[item.id])} className={`tap ${state.saved[item.id] ? 'text-rust' : 'text-mute hover:text-paper'}`}>
              <Icon name={state.saved[item.id] ? 'bookmark-fill' : 'bookmark'} size={14} />
            </button>
            <button onClick={() => actionEnqueue(item.id, state.queue.includes(item.id))} className={`tap ${state.queue.includes(item.id) ? 'text-moss' : 'text-mute hover:text-paper'}`}>
              <Icon name="queue" size={14} />
            </button>
          </div>
        </div>
      </div>
      {positionPct > 0 && positionPct < 100 && (
        <div className="ml-[calc(64px+1rem)] sm:ml-[calc(80px+1.25rem)] mt-3 h-[2px] bg-paper/8 relative rounded-full overflow-hidden">
          <div className="absolute inset-y-0 left-0 bg-moss rounded-full" style={{ width: `${positionPct}%` }} />
        </div>
      )}
    </li>
  );
}

function EpisodeView({ item, onClose }) {
  const state = useStoreState();
  const player = usePlayer();
  const isCurrent = state.nowPlaying === item.id;
  const play = state.plays[item.id];
  const dur = (isCurrent ? player.duration : 0) || item.duration || 0;
  const pos = isCurrent ? player.position : (play?.positionSec || 0);
  const pct = dur > 0 ? Math.min(100, (pos / dur) * 100) : 0;
  const isSaved = !!state.saved[item.id];
  const isQueued = state.queue.includes(item.id);
  const ctaLabel = isCurrent && player.playing
    ? 'pause'
    : (pos > 0 && !play?.played ? 'resume' : 'play');

  return (
    <div className="ink min-h-full fade-in">
      <div className="sticky top-0 z-10 ink2 border-b border-paper/10 px-5 sm:px-8 py-4 flex items-center justify-between">
        <button onClick={onClose} className="eo text-[11px] uppercase tracking-[0.18em] text-paper/60 hover:text-paper tap">
          ← back
        </button>
        <div className="flex items-center gap-5">
          <button onClick={() => actionSave(item.id, isSaved)} className={`tap ${isSaved ? 'text-rust' : 'text-paper/60 hover:text-paper'}`}>
            <Icon name={isSaved ? 'bookmark-fill' : 'bookmark'} size={18} />
          </button>
          <button onClick={() => actionEnqueue(item.id, isQueued)} className={`tap ${isQueued ? 'text-moss' : 'text-paper/60 hover:text-paper'}`}>
            <Icon name="queue" size={18} />
          </button>
          {item.link && (
            <a href={item.link} target="_blank" rel="noopener" className="text-paper/60 hover:text-moss2 tap">
              <Icon name="external" size={18} />
            </a>
          )}
        </div>
      </div>

      <article className="px-5 sm:px-8 py-10 sm:py-14 max-w-2xl mx-auto">
        <div className="eo text-[10px] uppercase tracking-[0.2em] text-moss mb-5">
          {item.feedTitle}
          <span className="text-mute2"> · {fmtDate(item.pubTs)}</span>
          {item.duration > 0 && <span className="text-mute2"> · {fmtTime(item.duration)}</span>}
        </div>
        <h1 className="text-[26px] sm:text-[34px] font-bold leading-[1.15] tracking-tight mb-8 text-balance">{item.title}</h1>

        {item.image && (
          <div className="mb-10 rounded-2xl overflow-hidden cover-shadow max-w-sm mx-auto">
            <img src={item.image} alt="" className="w-full aspect-square object-cover" />
          </div>
        )}

        <div className="mb-12">
          <div className="flex justify-center">
            <button
              onClick={() => isCurrent ? player.toggle() : player.playItem(item)}
              disabled={!item.audio}
              className={`flex items-center gap-3 px-8 py-3.5 rounded-full eo text-[12px] uppercase tracking-[0.2em] tap transition-colors disabled:opacity-40 ${isCurrent && player.playing ? 'bg-moss text-ink shadow-lg shadow-moss/25' : 'border-2 border-moss text-moss hover:bg-moss/10'}`}
            >
              <Icon name={isCurrent && player.playing ? 'pause' : 'play'} size={14} />
              {ctaLabel}
            </button>
          </div>
          {pct > 0 && pct < 100 && (
            <div className="mt-6 max-w-md mx-auto">
              <div className="h-[3px] bg-paper/10 rounded-full overflow-hidden">
                <div className="h-full bg-moss rounded-full" style={{ width: `${pct}%` }} />
              </div>
              <div className="flex justify-between eo text-[10px] text-mute tabular-nums mt-2">
                <span>{fmtTime(pos)}</span>
                <span>−{fmtTime(Math.max(0, dur - pos))}</span>
              </div>
            </div>
          )}
          {play?.played && (
            <div className="mt-5 text-center eo text-[10px] uppercase tracking-[0.18em] text-sage">✓ played</div>
          )}
          {!item.audio && (
            <div className="mt-5 text-center eo text-[10px] uppercase tracking-[0.18em] text-mute2">no audio in this item</div>
          )}
        </div>

        {(item.descHtml || item.desc) && (
          <div className="prose-dark" dangerouslySetInnerHTML={{ __html: item.descHtml || item.desc }} />
        )}
      </article>
    </div>
  );
}

function FeedDetail({ feed, onClose, onOpenItem }) {
  const state = useStoreState();
  const [refreshing, setRefreshing] = useState(false);
  const [sort, setSort] = useSort('feedDetail', 'newest');
  const isPodcast = feed.kind === 'podcast';
  const items = useMemo(() => {
    const filtered = Object.values(state.items).filter(it => it.feedId === feed.id);
    return applySort(filtered, sort, state.plays);
  }, [state.items, feed.id, sort, state.plays]);

  const refresh = async () => {
    setRefreshing(true);
    try { await actionRefresh(feed.id); } finally { setRefreshing(false); }
  };

  const unsubscribe = () => {
    if (confirm(`Unsubscribe from "${feed.title}"?`)) { actionUnsubscribe(feed.id); onClose(); }
  };

  return (
    <div className="ink min-h-full fade-in">
      <div className="sticky top-0 z-10 ink2 border-b border-paper/10 px-5 sm:px-8 py-4 flex items-center justify-between">

          ← back
        </button>
        <div className="flex items-center gap-4">
          <button onClick={refresh} disabled={refreshing} className={`text-paper/60 hover:text-paper tap ${refreshing ? 'animate-spin' : ''}`}>
            <Icon name="refresh" size={18} />
          </button>
          <button onClick={unsubscribe}
            title="Delete (unsubscribe)"
            className="eo text-[11px] uppercase tracking-[0.18em] text-paper/60 hover:text-rust tap flex items-center gap-1">
            <Icon name="trash" size={14} /> DES
          </button>
        </div>
      </div>

      {/* Feed header */}
      <div className="px-5 sm:px-8 py-10 flex gap-5 sm:gap-8 border-b border-paper/10">
        {feed.image && (
          <div className="w-32 h-32 sm:w-44 sm:h-44 flex-shrink-0 cover-shadow rounded-2xl overflow-hidden">
            <img src={feed.image} alt={feed.title} className="w-full h-full object-cover" />

        )}
        <div className="flex-1 min-w-0">
          <div className="eo text-[10px] uppercase tracking-[0.18em] text-moss mb-2">podcast</div>
          <h1 className="text-2xl sm:text-3xl font-bold tracking-tight leading-tight mb-3">{feed.title}</h1>
          {feed.author && <div className="text-[14px] italic text-paper/60 mb-3">{feed.author}</div>}
          <p className="text-sm text-paper/70 clamp-3 leading-relaxed">{feed.description}</p>

function PlayerBar() {

            onClick={(e) => { e.stopPropagation(); player.toggle(); }}
            className="w-10 h-10 rounded-full bg-moss text-ink flex items-center justify-center tap shadow-lg shadow-moss/20"
          >
            <Icon name={player.playing ? 'pause' : 'play'} size={14} />
          </button>

        <div className="px-4 sm:px-6 py-4">
          <div className="flex items-start justify-between mb-4">
            <div className="flex items-center gap-3 flex-1 min-w-0">

                <div className="eo text-[10px] uppercase tracking-[0.15em] text-moss mb-0.5 clamp-1">{item.feedTitle}</div>

          <div className="mb-1">
            <input
              type="range"
              className="seek"
              min="0"
              max={dur || 0}
              value={player.position || 0}
              onChange={(e) => player.seekTo(parseFloat(e.target.value))}
            />
          </div>
          <div className="flex justify-between eo text-[10px] text-mute tabular-nums mb-3">
            <span>{fmtTime(player.position)}</span>
            <span>−{fmtTime(Math.max(0, dur - player.position))}</span>
          </div>

          {/* Controls */}
          <div className="flex items-center justify-center gap-6 mb-3">
            <button onClick={() => player.seek(-15)} className="text-paper hover:text-moss tap relative">
              <Icon name="bwd-15" size={26} />
              <span className="absolute inset-0 flex items-center justify-center eo text-[8px] mt-1">15</span>
            </button>
            <button onClick={() => player.toggle()} className="w-16 h-16 rounded-full bg-moss text-ink flex items-center justify-center tap shadow-xl shadow-moss/25 hover:scale-105 transition-transform">
              <Icon name={player.playing ? 'pause' : 'play'} size={22} />

            <button onClick={() => player.seek(30)} className="text-paper hover:text-moss tap relative">
              <Icon name="fwd-30" size={26} />
              <span className="absolute inset-0 flex items-center justify-center eo text-[8px] mt-1">30</span>
            </button>
          </div>

          {/* secondary row */}
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2">
              {[1, 1.25, 1.5, 1.75, 2].map(r => (
                <button key={r} onClick={() => player.setSpeed(r)}

              ))}

              <button onClick={() => actionTogglePlayed(item.id)} className={`tap ${state.plays[item.id]?.played ? 'text-sage' : 'text-mute hover:text-paper'}`}>

function EOLogRibbon({ visible, onClose }) {
  const events = useRecentEvents();

  if (!visible) return null;

  return (
    <div className="fixed bottom-0 left-0 right-0 z-40 ink3 border-t border-paper/20 max-h-[40vh] flex flex-col" style={{ paddingBottom: 'env(safe-area-inset-bottom)' }}>
      <div className="flex items-center justify-between px-4 py-2 border-b border-paper/10">
        <div className="eo text-[10px] uppercase tracking-[0.2em] text-mute">{OP_GLYPH.SYN} given-log · last {events.length}</div>
        <button onClick={onClose} className="text-mute hover:text-paper tap">
          <Icon name="x" size={14} />
        </button>
      </div>
      <div className="flex-1 overflow-y-auto clean-scroll px-4 py-2 space-y-1 font-mono text-[10.5px]">
        {events.slice().reverse().map(ev => (
          <div key={ev.id} className="flex items-center gap-3 hover:bg-paper/5 px-1 py-0.5">
            <span className="text-mute2 tabular-nums w-12 text-right">{String(ev.seq).padStart(4, '0')}</span>
            <span className="text-mute2 tabular-nums">{new Date(ev.ts).toLocaleTimeString('en-US', { hour12: false })}</span>
            <span className="eo-op text-moss">{ev.op}</span>
            <span className="text-mute2">{OP_GLYPH[ev.op]}</span>
            <span className="text-paper/80 truncate flex-1">{ev.site}</span>
            <span className="text-sage hidden sm:inline">{ev.resolution}</span>
          </div>
        ))}
        {events.length === 0 && (
          <div className="eo text-[10px] text-mute py-4 text-center blink-cursor">awaiting first event</div>
        )}
      </div>
    </div>
  );
}

function UpdatePanel() {
  const [busy, setBusy] = useState(false);
  const [err, setErr]   = useState('');

  // Service workers don't run on file:// — surfacing the button there would
  // just confuse users.
  const supported = typeof navigator !== 'undefined'
    && 'serviceWorker' in navigator
    && /^https?:$/.test(location.protocol);

  if (!supported) return null;

  const handleForceUpdate = async () => {
    if (busy) return;
    const ok = window.confirm(
      'Force-fetch the latest brrst from the server?\n\n'
      + 'This clears the offline app cache and reloads the page. '
      + 'Your feeds, settings, and Matrix session stay put.'
    );
    if (!ok) return;
    setBusy(true);
    setErr('');
    try {
      await window.brrstForceReload();
      // brrstForceReload reloads the page, so we shouldn't reach here.
    } catch (e) {
      setErr(e?.message || String(e));
      setBusy(false);
    }
  };

  return (
    <section>
      <div className="eo text-[10px] uppercase tracking-[0.18em] text-moss mb-2">app updates</div>
      <button
        onClick={handleForceUpdate}
        disabled={busy}
        className="w-full py-2.5 border border-paper/20 text-paper/80 eo text-[11px] uppercase tracking-[0.2em] hover:bg-paper/5 tap rounded-full disabled:opacity-50">
        {busy ? 'reloading…' : 'force update from origin'}
      </button>
      <p className="text-[11px] text-mute mt-2 leading-relaxed">
        Drops the cached app shell and re-downloads brrst from {location.host || 'origin'}. Use this when a new version has shipped but the PWA is still serving an old build.
      </p>
      {err && <div className="text-[11px] text-red-400 mt-2">{err}</div>}
    </section>
  );
}

function SubscriptionsPanel() {
  const state = useStoreState();
  const fileRef = useRef(null);
  const [busy, setBusy]       = useState(false);
  const [progress, setProgress] = useState(null);  // { stage, done, total, current, added, failed }
  const [result, setResult]   = useState(null);
  const [err, setErr]         = useState('');

  const handleExport = () => {
    try {
      const n = exportOPML();
      setResult({ kind: 'export', count: n });
    } catch (e) { setErr(e.message || String(e)); }
  };

  const handleRefresh = async () => {
    setBusy(true); setErr(''); setResult(null); setProgress(null);
    try {
      await actionRefreshAll();
      setResult({ kind: 'refresh', count: state.subscriptions.length });
    } catch (e) { setErr(e.message || String(e)); }
    finally { setBusy(false); }
  };

  const handleImport = async (file) => {
    setBusy(true); setErr(''); setResult(null); setProgress(null);
    try {
      const text = await file.text();
      const summary = await importOPML(text, (p) => setProgress(p));
      setResult({ kind: 'import', ...summary });
      setProgress(null);
    } catch (e) {
      setErr(e.message || String(e));
    } finally {
      setBusy(false);
      if (fileRef.current) fileRef.current.value = '';
    }
  };

  const onFile = (e) => {
    const f = e.target.files?.[0];
    if (f) handleImport(f);
  };

  return (
    <section>
      <div className="flex items-center justify-between mb-2">
        <div className="eo text-[10px] uppercase tracking-[0.18em] text-moss">subscriptions</div>
        <div className="eo text-[10px] text-mute2 tabular-nums">{state.subscriptions.length}</div>
      </div>

      <div className="space-y-2">
        <button
          onClick={handleRefresh}
          disabled={busy}
          className="w-full py-2.5 border border-paper/20 text-paper/80 eo text-[11px] uppercase tracking-[0.2em] hover:bg-paper/5 tap rounded-full disabled:opacity-50"
        >
          ↻ refresh all
        </button>

        <div className="grid grid-cols-2 gap-2">
          <button
            onClick={handleExport}
            disabled={busy || state.subscriptions.length === 0}
            className="py-2.5 border border-paper/20 text-paper/80 eo text-[11px] uppercase tracking-[0.2em] hover:bg-paper/5 tap rounded-full disabled:opacity-50"
          >
            ↓ opml
          </button>
          <button
            onClick={() => fileRef.current?.click()}
            disabled={busy}
            className="py-2.5 border border-moss/40 text-moss eo text-[11px] uppercase tracking-[0.2em] hover:bg-moss/10 tap rounded-full disabled:opacity-50"
          >
            ↑ opml
          </button>
        </div>
        <input
          ref={fileRef}
          type="file"
          accept=".opml,.xml,application/xml,text/xml,text/x-opml"
          className="hidden"
          onChange={onFile}
        />
      </div>

      {progress && (
        <div className="mt-3 ink3 rounded-xl px-3 py-2 border border-paper/8">
          <div className="flex justify-between eo text-[10px] uppercase tracking-[0.18em] text-mute mb-1">
            <span>importing</span>
            <span className="tabular-nums">{progress.done} / {progress.total}</span>
          </div>
          <div className="h-[2px] bg-paper/10 rounded-full overflow-hidden mb-2">
            <div className="h-full bg-moss" style={{ width: `${progress.total ? (progress.done / progress.total) * 100 : 0}%` }} />
          </div>
          {progress.current && <div className="text-[11px] text-paper/70 clamp-1">{progress.current}</div>}
        </div>
      )}

      {result && !progress && (
        <div className="mt-3 eo text-[10.5px] text-moss2 leading-snug">
          {result.kind === 'export' && `↬ exported ${result.count} feeds as opml`}
          {result.kind === 'import' && `↬ added ${result.added}, skipped ${result.skipped} dupes${result.failed ? `, ${result.failed} failed` : ''}`}
          {result.kind === 'refresh' && `↬ refreshed ${result.count} feeds`}
        </div>
      )}

      {err && (
        <div className="mt-3 eo text-[10.5px] text-rust leading-snug break-words">
          {err}
        </div>
      )}
    </section>
  );
}

function LoginForm({ onDone, onCancel }) {
  const [user, setUser] = useState('');
  const [pass, setPass] = useState('');
  const [hs, setHs]     = useState(Matrix.homeserver || '');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');

  // "alice:matrix.org" or "@alice:matrix.org" → split into user + homeserver.
  // When present, the server-suffix wins and the homeserver field is hidden.
  const splitId = (raw) => {
    const trimmed = String(raw || '').trim().replace(/^@/, '');
    const i = trimmed.indexOf(':');
    if (i > 0 && i < trimmed.length - 1) {
      return { username: trimmed.slice(0, i), server: trimmed.slice(i + 1) };
    }
    return null;
  };
  const parsed = splitId(user);

  const submit = async (e) => {
    e?.preventDefault();
    const username = parsed ? parsed.username : user.trim();
    const server   = parsed ? parsed.server   : hs.trim();
    if (!username || !pass || !server) return;
    setBusy(true); setErr('');
    try {
      await Matrix.login(username, pass, server);
      await Matrix.ensureUserRoom();
      // hydrate from matrix in case there's existing data
      await store.hydrateFromMatrix();
      onDone();
    } catch (ex) {
      setErr(ex.message || String(ex));
    } finally {
      setBusy(false);
    }
  };

  return (
    <form onSubmit={submit} className="space-y-2">
      <input type="text" value={user} onChange={e => setUser(e.target.value)} placeholder="username (or user:server.com)"
        autoCapitalize="off" autoCorrect="off" spellCheck={false}
        className="w-full bg-ink3 px-3 py-2.5 text-sm font-mono text-paper border border-paper/15 outline-none focus:border-moss/60 rounded-xl" />
      <input type="password" value={pass} onChange={e => setPass(e.target.value)} placeholder="password"
        className="w-full bg-ink3 px-3 py-2.5 text-sm font-mono text-paper border border-paper/15 outline-none focus:border-moss/60 rounded-xl" />
      {!parsed && (
        <input type="text" value={hs} onChange={e => setHs(e.target.value)} placeholder="homeserver (e.g. matrix.org)"
          autoCapitalize="off" autoCorrect="off" spellCheck={false}
          className="w-full bg-ink3 px-3 py-2.5 text-sm font-mono text-paper border border-paper/15 outline-none focus:border-moss/60 rounded-xl" />
      )}
      <div className="flex gap-2">
        <button type="submit" disabled={busy}
          className="flex-1 py-2.5 border border-moss/40 text-moss eo text-[11px] uppercase tracking-[0.2em] hover:bg-moss/10 tap disabled:opacity-50 rounded-full">
          {busy ? '…' : 'enter'}
        </button>
        <button type="button" onClick={onCancel}
          className="px-3 py-2.5 border border-paper/20 text-paper/70 eo text-[11px] uppercase tracking-[0.2em] hover:bg-paper/5 tap rounded-full">
          cancel
        </button>
      </div>
      {err && <div className="eo text-[10px] text-moss">{err}</div>}
    </form>
  );
}

//  PROXY SETTINGS  ▌ runtime-editable proxy config + live health check
// ═══════════════════════════════════════════════════════════════════════════

const TEST_FEED_URL = 'https://feeds.npr.org/510289/podcast.xml';  // NPR Up First — small, stable

function ProxySettings() {
  const [url, setUrl]       = useState(CONFIG.PROXY_URL);
  const [param, setParam]   = useState(CONFIG.PROXY_PARAM);
  const [status, setStatus] = useState({ state: 'unknown', msg: '', ts: 0 });
  const [busy, setBusy]     = useState(false);
  const [dirty, setDirty]   = useState(false);

  useEffect(() => {
    (async () => {
      const u = await IDB.getKv('proxy.url');
      const p = await IDB.getKv('proxy.param');
      const s = await IDB.getKv('proxy.status');
      if (u) setUrl(u);
      if (p) setParam(p);
      if (s) setStatus(s);
    })();
  }, []);

  const save = async () => {
    await IDB.setKv('proxy.url', url.trim());
    await IDB.setKv('proxy.param', param.trim() || 'url');
    const fresh = { state: 'unknown', msg: 'config changed', ts: _now() };
    await IDB.setKv('proxy.status', fresh);
    setStatus(fresh);
    setDirty(false);
  };

  const test = async () => {
    if (dirty) await save();
    setBusy(true);
    const t0 = _now();
    try {
      const u = `${url.trim()}?${encodeURIComponent(param.trim() || 'url')}=${encodeURIComponent(TEST_FEED_URL)}`;
      const res = await fetch(u);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const ct = res.headers.get('content-type') || '';
      const xbrrst = res.headers.get('x-brrst-proxy');
      const cors = res.headers.get('access-control-allow-origin');
      const xml = await res.text();
      const doc = new DOMParser().parseFromString(xml, 'application/xml');
      if (doc.querySelector('parsererror')) throw new Error('returned body is not valid XML');
      if (!doc.querySelector('channel, feed')) throw new Error('no <channel> or <feed> element');
      const ms = _now() - t0;
      const detail = [
        `${ms}ms`,
        `${(xml.length / 1024).toFixed(1)}kb`,
        cors === '*' ? 'cors:*' : `cors:${cors || 'missing'}`,
        xbrrst ? 'x-brrst-proxy:1' : 'no-proxy-tag',
      ].join(' · ');
      const ok = { state: 'ok', msg: detail, ts: _now() };
      await IDB.setKv('proxy.status', ok);
      setStatus(ok);
    } catch (e) {
      const err = { state: 'fail', msg: (e.message || String(e)).slice(0, 140), ts: _now() };
      await IDB.setKv('proxy.status', err);
      setStatus(err);
    } finally {
      setBusy(false);
    }
  };

  const reset = () => {
    setUrl(CONFIG.PROXY_URL);
    setParam(CONFIG.PROXY_PARAM);
    setDirty(true);
  };

  const dotColor = status.state === 'ok' ? 'bg-moss' : status.state === 'fail' ? 'bg-rust' : 'bg-mute2';
  const dotPulse = status.state === 'ok' ? 'pulse-moss' : '';

  return (
    <section>
      <div className="flex items-center justify-between mb-2">
        <div className="eo text-[10px] uppercase tracking-[0.18em] text-moss">proxy</div>
        <div className="flex items-center gap-1.5">
          <span className={`inline-block w-2 h-2 rounded-full ${dotColor} ${dotPulse}`}></span>
          <span className="eo text-[10px] uppercase tracking-[0.15em] text-mute">
            {status.state === 'ok' ? 'reachable' : status.state === 'fail' ? 'failed' : 'untested'}
          </span>
        </div>
      </div>

      <div className="ink3 rounded-xl p-3 space-y-2 border border-paper/8">
        <label className="block">
          <span className="eo text-[9px] uppercase tracking-[0.18em] text-mute2">endpoint</span>
          <input
            type="url"
            value={url}
            onChange={e => { setUrl(e.target.value); setDirty(true); }}
            placeholder="https://your-proxy/feed"
            className="w-full mt-1 bg-ink2 px-2.5 py-1.5 text-[12px] font-mono text-paper border border-paper/10 outline-none focus:border-moss/50 rounded-lg"
            spellCheck="false"
            autoComplete="off"
          />
        </label>
        <label className="block">
          <span className="eo text-[9px] uppercase tracking-[0.18em] text-mute2">query param</span>
          <input
            type="text"
            value={param}
            onChange={e => { setParam(e.target.value); setDirty(true); }}
            placeholder="url"
            className="w-full mt-1 bg-ink2 px-2.5 py-1.5 text-[12px] font-mono text-paper border border-paper/10 outline-none focus:border-moss/50 rounded-lg"
            spellCheck="false"
            autoComplete="off"
          />
        </label>

        <div className="flex gap-2 pt-1">
          <button
            type="button"
            onClick={test}
            disabled={busy}
            className="flex-1 py-1.5 border border-moss/40 text-moss eo text-[10px] uppercase tracking-[0.2em] hover:bg-moss/10 tap rounded-full disabled:opacity-50"
          >
            {busy ? 'pinging…' : '↬ test'}
          </button>
          {dirty && (
            <button
              type="button"
              onClick={save}
              className="flex-1 py-1.5 border border-paper/25 text-paper/80 eo text-[10px] uppercase tracking-[0.2em] hover:bg-paper/5 tap rounded-full"
            >
              save
            </button>
          )}
          <button
            type="button"
            onClick={reset}
            title="reset to default"
            className="px-3 py-1.5 border border-paper/15 text-paper/50 eo text-[10px] uppercase tracking-[0.2em] hover:bg-paper/5 tap rounded-full"
          >
            ↺
          </button>
        </div>

        {status.msg && (
          <div className={`eo text-[10px] leading-snug pt-1.5 ${status.state === 'fail' ? 'text-rust' : status.state === 'ok' ? 'text-moss2' : 'text-mute'}`}>
            {status.msg}
          </div>
        )}
      </div>
    </section>
  );
}

// ═══════════════════════════════════════════════════════════════════════════
//  APP ROOT
// ═══════════════════════════════════════════════════════════════════════════

function App() {
  const [drawer, setDrawer] = useState(false);
  const [booted, setBooted] = useState(false);

  useEffect(() => {
    (async () => {
      await IDB.open();
      await store.hydrate();
      const ok = await Matrix.restore();
      if (ok) {
        try {
          await Matrix.ensureUserRoom();
          if ((await IDB.maxSeq()) === 0) await store.hydrateFromMatrix();
        } catch (e) { console.warn(e); }
      }
      // open the genesis NUL event if log is empty
      if ((await IDB.maxSeq()) === 0) {
        await store.dispatch(OP.NUL, 'brrst', { greeting: 'genesis' });
      }
      setBooted(true);
    })();
  }, []);

  if (!booted) {
    return (
      <div className="ink min-h-screen flex items-center justify-center">
        <div className="text-center">
          <div className="text-4xl font-extrabold tracking-tighter mb-3 flex items-baseline justify-center gap-1.5">
            <span className="lowercase">brrst</span>
            <span className="sprout text-moss grow-dot"></span>
          </div>
          <div className="eo text-[10px] uppercase tracking-[0.2em] text-mute blink-cursor">replaying given-log</div>
        </div>
      </div>
    );
  }

  return (
    <StoreCtx.Provider value={store}>
      <PlayerProvider>
        <AppInner drawer={drawer} setDrawer={setDrawer} />
      </PlayerProvider>
    </StoreCtx.Provider>
  );
}

function AppInner({ drawer, setDrawer }) {
  const player = usePlayer();
  const state  = useStoreState();
  const [openFeedId, setOpenFeedId] = useState(null);
  const [openItemId, setOpenItemId] = useState(null);
  const subscribeInputRef = useRef(null);

  const handleSubscribe = async (url) => {
    const feed = await actionSubscribe(url);
    if (feed?.id) {
      setOpenItemId(null);
      setOpenFeedId(feed.id);
    }
    return feed;
  };

  const focusSubscribe = () => {
    const el = subscribeInputRef.current;
    if (!el) return;
    setOpenItemId(null);
    setOpenFeedId(null);
    try { el.scrollIntoView({ block: 'start', behavior: 'smooth' }); } catch {}
    el.focus({ preventScroll: false });
  };

  const navigate = (action) => {
    if (!action) return;
    if (action.type === 'feed') {
      const f = state.feeds[action.id];
      if (!f) return;
      setOpenItemId(null);
      setOpenFeedId(action.id);
    } else if (action.type === 'item') {
      const it = state.items[action.id];
      if (!it) return;
      setOpenFeedId(null);
      setOpenItemId(action.id);
    } else if (action.type === 'play') {
      const it = state.items[action.id];
      if (it?.audio) player.playItem(it).catch(() => {});
    }
  };

  return (
    <div className="min-h-screen flex flex-col">
      <Masthead onMenu={() => setDrawer(true)} />
      <SubscribeBar tab="pods" onSubscribe={handleSubscribe} onNavigate={navigate} inputRef={subscribeInputRef} />
      <main className="flex-1 pb-32">
        <PodsView
          openFeedId={openFeedId} setOpenFeedId={setOpenFeedId}
          openItemId={openItemId} setOpenItemId={setOpenItemId}
          onAddShow={focusSubscribe}
        />
      </main>
      <PlayerBar />
      <Drawer open={drawer} onClose={() => setDrawer(false)} />
    </div>
  );
}

<script>
  // PWA: register service worker (only on http(s), not file://)
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((err) => {
        console.warn('[brrst] service worker registration failed:', err);
      });
    });
  }

  // Force-reload escape hatch: clears the SW cache, unregisters every worker
  // in scope, then reloads from origin (GitHub Pages or wherever the PWA is
  // hosted). IndexedDB and localStorage are deliberately left intact so the
  // user keeps their feeds, settings, and Matrix session.
  window.brrstForceReload = async function brrstForceReload() {
    const log = (...args) => console.info('[brrst][force-reload]', ...args);
    try {
      if ('serviceWorker' in navigator) {
        const reg = await navigator.serviceWorker.getRegistration();
        const sw = reg && (reg.active || reg.waiting || reg.installing);
        if (sw) {
          await new Promise((resolve) => {
            const ch = new MessageChannel();
            const timer = setTimeout(resolve, 2000);
            ch.port1.onmessage = (e) => {
              clearTimeout(timer);
              log('sw cleared caches:', e.data);
              resolve();
            };
            try { sw.postMessage('CLEAR_CACHES', [ch.port2]); }
            catch (err) { clearTimeout(timer); log('postMessage failed:', err); resolve(); }
          });
        }
      }
      if ('caches' in self) {
        const keys = await caches.keys();
        await Promise.all(keys.map((k) => caches.delete(k)));
        log('deleted caches:', keys);
      }
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map((r) => r.unregister()));
        log('unregistered workers:', regs.length);
      }
    } catch (err) {
      console.warn('[brrst][force-reload] cleanup failed, reloading anyway:', err);
    }
    // Cache-bust the navigation itself in case an intermediate proxy or the
    // browser's HTTP cache still holds the old shell.
    const url = new URL(location.href);
    url.searchParams.set('_brrst_reload', Date.now().toString(36));
    location.replace(url.toString());
  };
</script>
